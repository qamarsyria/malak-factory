name: 🎬 مسار القصص (Stories)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  produce:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      models: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-hosny-amiri espeak-ng libespeak-ng1
          pip install --upgrade pip
          pip install requests pillow arabic-reshaper huggingface_hub quranic-phonemizer
          pip install --force-reinstall phonemizer==3.2.1

      - name: Generate Story
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python -u scripts/generate_story.py
          if [ -f out/latest_episode.txt ]; then
            EP_FILE=$(cat out/latest_episode.txt)
            echo "EP_FILE=$EP_FILE" >> $GITHUB_OUTPUT
            echo "EP_NAME=$(basename "$EP_FILE" .json)" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      # 🌟 1. بناء السوشيال (سرد + بشري)
      - name: Build Social Audio (Narration + Human)
        id: soc_aud
        if: steps.gen.outputs.EP_FILE != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python scripts/story_audio.py \
            --mode human \
            --json "${{ steps.gen.outputs.EP_FILE }}" \
            --out_audio "out/social_${{ steps.gen.outputs.EP_NAME }}.mp3" \
            --out_meta "out/social_${{ steps.gen.outputs.EP_NAME }}_meta.json"

      - name: Build Social Video
        if: steps.soc_aud.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/story_video.py \
            "out/social_${{ steps.gen.outputs.EP_NAME }}.mp3" \
            "out/social_${{ steps.gen.outputs.EP_NAME }}_meta.json" \
            "videos/social_${{ steps.gen.outputs.EP_NAME }}.mp4"

      # 🌟 2. بناء اليوتيوب (سرد + جيميني)
      - name: Build YouTube Audio (Narration + Gemini)
        id: yt_aud
        if: steps.gen.outputs.EP_FILE != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python scripts/story_audio.py \
            --mode gemini \
            --json "${{ steps.gen.outputs.EP_FILE }}" \
            --out_audio "out/yt_${{ steps.gen.outputs.EP_NAME }}.mp3" \
            --out_meta "out/yt_${{ steps.gen.outputs.EP_NAME }}_meta.json"

      - name: Build YouTube Video
        if: steps.yt_aud.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/story_video.py \
            "out/yt_${{ steps.gen.outputs.EP_NAME }}.mp3" \
            "out/yt_${{ steps.gen.outputs.EP_NAME }}_meta.json" \
            "videos/yt_${{ steps.gen.outputs.EP_NAME }}.mp4"

      - name: Upload to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # نرفع كل الملفات لوحدها عشان تسمع الفرق
          for f in out/social_*.mp3 out/yt_*.mp3 videos/*.mp4; do
            if [ -f "$f" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" -F "document=@${f}" -F "caption=📁 $(basename $f)"
            fi
          done

      - name: Commit State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/finalize_episode.py "${{ steps.gen.outputs.EP_FILE }}" || true
          git add state/ || true
          git commit -m "🎬 ${{ steps.gen.outputs.EP_NAME }}" || echo "لا تغييرات"
          git push || true

      - name: Cleanup
        if: always()
        run: |
          rm -rf videos/*.mp4 out/*.mp3 out/*_meta.json data/stories/generated/*.json out/latest_episode.txt
