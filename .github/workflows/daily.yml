name: Daily Video Factory

on:
  schedule:
    # 05:00 UTC = 08:00 دمشق
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg + Arabic fonts + libraqm
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-noto-core libraqm0
          echo "═══════════════════════════════════════"
          echo "الخطوط العربية المتوفرة:"
          echo "═══════════════════════════════════════"
          fc-list :lang=ar | head -20
          echo ""
          echo "═══════════════════════════════════════"
          echo "التحقق من libraqm:"
          echo "═══════════════════════════════════════"
          ldconfig -p | grep -i raqm || echo "⚠️ libraqm غير موجود"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Verify Pillow has RAQM
        run: |
          python -c "
          from PIL import features
          print('Pillow version:', __import__('PIL').__version__)
          raqm = features.check('raqm')
          print('RAQM support:', raqm)
          if not raqm:
              print('⚠️  RAQM not available — النص العربي قد يظهر مشوّهاً')
          else:
              print('✅ RAQM متوفر — النص العربي سيظهر بشكل صحيح')
          "

      - name: Prepare JSON from sources
        run: |
          node scripts/parse_content.js
          node scripts/parse_riyad.js

      - name: Run factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/main.py

      - name: Upload video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: out/video.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload composite image as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composite-${{ github.run_number }}
          path: out/composite.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/published.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update published state [skip ci]"
            git push
          fi
