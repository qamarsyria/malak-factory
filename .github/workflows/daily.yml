name: Daily
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          path: factory
      - uses: actions/checkout@v4
        with:
          repository: qamarsyria/qamar-malak
          token: ${{ secrets.GH_PAT }}
          path: platform
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract
        run: node scripts/extract_sources.js
        working-directory: factory
        env:
          PLATFORM_ROOT: ${{ github.workspace }}/platform
      - name: Push
        run: |
          cd factory
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto-generated/sources.json
          git commit -m "Extract sources" || echo "No changes"
          git push
