name: 🎬 مسار القصص (Stories)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    # 🌟 صلاحية ضرورية لاستخدام GitHub Models وكتابة الحالة
    permissions:
      models: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-hosny-amiri espeak-ng libespeak-ng1
          pip install --upgrade pip
          pip install requests edge-tts silma-tts pillow arabic-reshaper huggingface_hub quranic-phonemizer
          pip install --force-reinstall phonemizer==3.2.1

      # 🌟 تحميل نموذج SILMA TTS (يتم مرة واحدة، ويستغرق دقائق في أول مرة)
      - name: Download SILMA TTS Model
        run: |
          python -c "from silma_tts.api import SilmaTTS; SilmaTTS()" || echo "⚠️ قد يفشل التحميل المسبق، سيعيد المحاولة عند التوليد."

      - name: Generate Story (GitHub Models)
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 🌟 ضروري لـ GPT-4o
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u scripts/generate_story.py
          if [ -f out/latest_episode.txt ]; then
            EP_FILE=$(cat out/latest_episode.txt)
            echo "EP_FILE=$EP_FILE" >> $GITHUB_OUTPUT
            echo "EP_NAME=$(basename "$EP_FILE" .json)" >> $GITHUB_OUTPUT
          else
            echo "❌ فشل توليد ملف الحلقة"
            exit 1
          fi

      - name: Build Audio (Both) - SILMA TTS
        id: aud
        if: steps.gen.outputs.EP_FILE != ''
        env:
          TTS_ENGINE: "silma" # 🌟 تفعيل SILMA TTS
          # SILMA_REF_AUDIO: "assets/audio/reference/sudais_ref.wav" # اختياري: ضعه هنا إذا أردت استنساخ صوت السديس
        run: |
          python scripts/story_audio.py \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "out/${{ steps.gen.outputs.EP_NAME }}_yt.mp3" \
            "out/${{ steps.gen.outputs.EP_NAME }}_social.mp3"

      - name: Build Video (YouTube)
        id: vid_yt
        if: steps.aud.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/story_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}_yt.mp3" \
            "out/${{ steps.gen.outputs.EP_NAME }}_yt_meta.json" \
            "videos/${{ steps.gen.outputs.EP_NAME }}_yt.mp4"

      - name: Build Video (Social)
        id: vid_soc
        if: steps.aud.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/story_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}_social.mp3" \
            "out/${{ steps.gen.outputs.EP_NAME }}_social_meta.json" \
            "videos/${{ steps.gen.outputs.EP_NAME }}_social.mp4"

      - name: Upload to Telegram (Both with Compression)
        id: tg
        if: steps.vid_yt.outcome == 'success' && steps.vid_soc.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          META="out/${{ steps.gen.outputs.EP_NAME }}_yt_meta.json"
          TITLE=$(python -c "import json; print(json.load(open('$META')).get('title','حلقة جديدة'))")
          
          # 1. فيديو اليوتيوب
          YT_VIDEO="videos/${{ steps.gen.outputs.EP_NAME }}_yt.mp4"
          YT_UPLOAD="$YT_VIDEO"
          SIZE=$(stat -c%s "$YT_VIDEO")
          if [ $((SIZE / 1024 / 1024)) -gt 45 ]; then
            YT_COMPRESSED="videos/${{ steps.gen.outputs.EP_NAME }}_yt_tg.mp4"
            ffmpeg -y -i "$YT_VIDEO" -vf "scale=-2:720" -c:v libx264 -b:v 600k -maxrate 800k -bufsize 1200k -preset fast -c:a aac -b:a 64k "$YT_COMPRESSED"
            YT_UPLOAD="$YT_COMPRESSED"
          fi
          
          CAPTION_YT=$(printf "🎬 [نسخة اليوتيوب - GPT-4o & SILMA]\n%s\n\n#قصص_الأنبياء #ملاك_المعرفة" "$TITLE")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" -F "video=@${YT_UPLOAD}" \
            -F "caption=${CAPTION_YT}" -F "supports_streaming=true"
            
          # 2. فيديو السوشيال ميديا
          SOC_VIDEO="videos/${{ steps.gen.outputs.EP_NAME }}_social.mp4"
          SOC_UPLOAD="$SOC_VIDEO"
          SIZE=$(stat -c%s "$SOC_VIDEO")
          if [ $((SIZE / 1024 / 1024)) -gt 45 ]; then
            SOC_COMPRESSED="videos/${{ steps.gen.outputs.EP_NAME }}_social_tg.mp4"
            ffmpeg -y -i "$SOC_VIDEO" -vf "scale=-2:720" -c:v libx264 -b:v 600k -maxrate 800k -bufsize 1200k -preset fast -c:a aac -b:a 64k "$SOC_COMPRESSED"
            SOC_UPLOAD="$SOC_COMPRESSED"
          fi
          
          CAPTION_SOC=$(printf "🎬 [نسخة فيسبوك/تيك توك - بشري]\n%s\n\n#قصص_الأنبياء #ملاك_المعرفة" "$TITLE")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" -F "video=@${SOC_UPLOAD}" \
            -F "caption=${CAPTION_SOC}" -F "supports_streaming=true"

      - name: Commit State
        if: steps.tg.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/finalize_episode.py "${{ steps.gen.outputs.EP_FILE }}"
          git add state/ || true
          git commit -m "🎬 ${{ steps.gen.outputs.EP_NAME }}" || echo "لا تغييرات"
          git push || true

      - name: Cleanup
        if: steps.tg.outcome == 'success'
        run: |
          rm -rf videos/*.mp4 out/*.mp3 out/*_meta.json
          rm -rf data/stories/generated/*.json
          rm -f out/latest_episode.txt
