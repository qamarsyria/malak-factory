name: Daily

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  generate-and-produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-hosny-amiri
          pip install -r requirements.txt

      - name: Generate Episode JSON
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python scripts/generate_story.py
          EP_FILE=$(cat out/latest_episode.txt)
          echo "EP_FILE=$EP_FILE" >> $GITHUB_OUTPUT
          EP_NAME=$(basename $EP_FILE .json)
          echo "EP_NAME=$EP_NAME" >> $GITHUB_OUTPUT

      - name: Build Audio
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          python scripts/story_audio.py "${{ steps.gen.outputs.EP_FILE }}" "out/${{ steps.gen.outputs.EP_NAME }}.mp3"

      - name: Build Video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/story_video.py "out/${{ steps.gen.outputs.EP_NAME }}.mp3" "out/${{ steps.gen.outputs.EP_NAME }}_meta.json" "videos/${{ steps.gen.outputs.EP_NAME }}.mp4"

      - name: Upload to Telegram and Get Message ID
        id: tg
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "📤 جاري إرسال الفيديو إلى تلغرام..."
          # نرسل الفيديو ونحتفظ بالرد لاستخراج message_id
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@videos/${{ steps.gen.outputs.EP_NAME }}.mp4" \
            -F "caption=🎬 حلقة جديدة من ملاك المعرفة! %0A #قصص_الأنبياء" \
            -F "supports_streaming=true")
            
          # استخراج message_id
          MSG_ID=$(echo $RESPONSE | grep -oP '"message_id":\K[0-9]+')
          echo "MSG_ID=$MSG_ID" >> $GITHUB_OUTPUT
          echo "✅ تم الرفع. رقم الرسالة: $MSG_ID"

      - name: Update Platform Feed (videos.json)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        working-directory: scripts
        run: |
          # استدعاء الدالة الخاصة بك لإضافة الفيديو للمنصة
          python -c "
          import json
          from update_feed import add_video_to_feed
          
          # قراءة عنوان الحلقة من ملف الميتا الذي أنشأه سكربت الفيديو
          meta = json.load(open('../out/${{ steps.gen.outputs.EP_NAME }}_meta.json'))
          
          add_video_to_feed(
              title=meta.get('title', 'حلقة جديدة'),
              description='شاهد الحلقة الجديدة من قصص الأنبياء على ملاك المعرفة.',
              video_url='${{ steps.tg.outputs.MSG_ID }}', # نمرر رقم الرسالة
              category='قصص الأنبياء'
          )
          "

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ data/stories/generated/ videos/
          git commit -m "🎬 توليد الحلقة اليومية: ${{ steps.gen.outputs.EP_NAME }}" || echo "لا تغييرات"
          git push
