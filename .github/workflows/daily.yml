name: Daily

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  generate-and-produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-hosny-amiri
          pip install -r requirements.txt

      - name: Generate Episode JSON
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python scripts/generate_story.py
          FILE=$(ls -t data/stories/generated/episode-*.json | head -1)
          echo "EP_FILE=$FILE" >> $GITHUB_OUTPUT
          EP_NAME=$(basename $FILE .json)
          echo "EP_NAME=$EP_NAME" >> $GITHUB_OUTPUT

      - name: Build Audio
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          python scripts/story_audio.py "${{ steps.gen.outputs.EP_FILE }}" "out/${{ steps.gen.outputs.EP_NAME }}.mp3"

      - name: Build Video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/story_video.py "out/${{ steps.gen.outputs.EP_NAME }}.mp3" "out/${{ steps.gen.outputs.EP_NAME }}_meta.json" "videos/${{ steps.gen.outputs.EP_NAME }}.mp4"

      # ⬇️ هذا هو الكود الجديد الذي يرسل الفيديو إلى تلغرام ⬇️
      - name: Upload to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EP_NAME: ${{ steps.gen.outputs.EP_NAME }}
        run: |
          echo "📤 جاري إرسال الفيديو إلى تلغرام..."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@videos/${EP_NAME}.mp4" \
            -F "caption=🎬 حلقة جديدة من ملاك المعرفة! %0A #قصص_الأنبياء" \
            -F "supports_streaming=true"

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ data/stories/generated/ videos/
          git commit -m "🎬 توليد الحلقة اليومية: ${{ steps.gen.outputs.EP_NAME }}" || echo "لا تغييرات"
          git push
