name: Daily Video Factory

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg + Arabic fonts + espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-noto-core libraqm0 espeak-ng
          echo "═══════════════════════════════════════"
          echo "الخطوط العربية:"
          fc-list :lang=ar | head -20
          echo "═══════════════════════════════════════"
          echo "espeak-ng:"
          espeak-ng --version
          echo "═══════════════════════════════════════"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Download Piper Arabic voice model
        run: |
          mkdir -p /tmp/piper
          cd /tmp/piper
          echo "⬇️  تحميل نموذج Piper (رجل أردني)..."
          wget -q "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO-kareem-medium/ar_JO-kareem-medium.onnx" -O ar_JO-kareem-medium.onnx
          wget -q "https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO-kareem-medium/ar_JO-kareem-medium.onnx.json" -O ar_JO-kareem-medium.onnx.json
          ls -lh /tmp/piper/

      - name: Verify Pillow has RAQM
        run: |
          python -c "
          from PIL import features
          import PIL
          print('Pillow version:', PIL.__version__)
          raqm = features.check('raqm')
          print('RAQM support:', raqm)
          if raqm:
              print('✅ RAQM متوفر')
          else:
              print('⚠️  RAQM غير متوفر')
          "

      - name: Prepare JSON from sources
        run: |
          node scripts/parse_content.js
          node scripts/parse_riyad.js

      - name: Run factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/main.py

      - name: Upload video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: out/video.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload composite image as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composite-${{ github.run_number }}
          path: out/composite.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/published.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update published state [skip ci]"
            git push
          fi
