name: Daily Video Factory

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg + Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-noto-core libraqm0
          echo "✅ تم التثبيت"
          fc-list :lang=ar | head -10

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Verify Pillow RAQM
        run: |
          python -c "from PIL import features; print('RAQM:', features.check('raqm'))"

      - name: Prepare JSON from sources
        run: |
          node scripts/parse_content.js
          node scripts/parse_riyad.js
          echo "✅ JSON جاهز"

      - name: Run factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/main.py

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: out/video.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload composite image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composite-${{ github.run_number }}
          path: out/composite.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/published.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update published state [skip ci]"
            git push
          fi
