name: Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-hosny-amiri
          pip install --upgrade pip
          pip install requests edge-tts pillow arabic-reshaper python-bidi huggingface_hub

      - name: Discover Models
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python -u scripts/model_discovery.py

      - name: Generate
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u scripts/generate_story.py
          if [ -f out/latest_episode.txt ]; then
            EP_FILE=$(cat out/latest_episode.txt)
            echo "EP_FILE=$EP_FILE" >> $GITHUB_OUTPUT
            echo "EP_NAME=$(basename "$EP_FILE" .json)" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      - name: Audio
        id: aud
        if: steps.gen.outputs.EP_FILE != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python scripts/story_audio.py \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "out/${{ steps.gen.outputs.EP_NAME }}.mp3"

      - name: Video
        id: vid
        if: steps.aud.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/story_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}.mp3" \
            "out/${{ steps.gen.outputs.EP_NAME }}_meta.json" \
            "videos/${{ steps.gen.outputs.EP_NAME }}.mp4"

      - name: Upload to Telegram
        id: tg
        if: steps.vid.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          META="out/${{ steps.gen.outputs.EP_NAME }}_meta.json"
          TITLE=$(python -c "import json; print(json.load(open('$META')).get('title','حلقة جديدة'))")
          CAPTION=$(printf "🎬 %s\n\n#قصص_الأنبياء #ملاك_المعرفة" "$TITLE")
          
          VIDEO_PATH="videos/${{ steps.gen.outputs.EP_NAME }}.mp4"
          UPLOAD_PATH="$VIDEO_PATH"
          
          SIZE_BYTES=$(stat -c%s "$VIDEO_PATH")
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          
          if [ "$SIZE_MB" -gt 48 ]; then
            echo "⚠️ الفيديو كبير. جاري الضغط إلى 720p..."
            COMPRESSED_PATH="videos/${{ steps.gen.outputs.EP_NAME }}_tg.mp4"
            # ضغط 720p مع bitrate 1000k (جودة ممتازة للمدة القصيرة)
            ffmpeg -y -i "$VIDEO_PATH" -vf "scale=-2:1280" -c:v libx264 -b:v 1000k -maxrate 1200k -bufsize 2000k -preset fast -c:a aac -b:a 96k "$COMPRESSED_PATH"
            UPLOAD_PATH="$COMPRESSED_PATH"
          fi
          
          RESP=$(curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${UPLOAD_PATH}" \
            -F "caption=${CAPTION}" \
            -F "supports_streaming=true")
            
          MSG=$(echo "$RESP" | grep -oP '"message_id":\K[0-9]+' || true)
          if [ -z "$MSG" ]; then
            echo "❌ تلغرام رفض: $RESP"
            exit 1
          fi
          echo "MSG_ID=$MSG" >> $GITHUB_OUTPUT

      - name: Finalize State
        if: steps.tg.outputs.MSG_ID != ''
        run: python scripts/finalize_episode.py "${{ steps.gen.outputs.EP_FILE }}"

      - name: Commit State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A state/ || true
          git commit -m "🎬 ${{ steps.gen.outputs.EP_NAME || 'daily run' }}" || echo "لا تغييرات"
          git push || true

      - name: Cleanup
        if: always()
        run: |
          rm -rf videos/*.mp4 out/*.mp3 out/*_meta.json
          rm -rf data/stories/generated/*.json
          rm -f out/latest_episode.txt
