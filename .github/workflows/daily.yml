name: Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-hosny-amiri espeak-ng libespeak-ng1
          pip install --upgrade pip
          pip install requests edge-tts pillow arabic-reshaper huggingface_hub tilavet-phonemizer

      - name: Discover Models
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python -u scripts/model_discovery.py

      - name: Generate Story
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u scripts/generate_story.py
          if [ -f out/latest_episode.txt ]; then
            EP_FILE=$(cat out/latest_episode.txt)
            echo "EP_FILE=$EP_FILE" >> $GITHUB_OUTPUT
            echo "EP_NAME=$(basename "$EP_FILE" .json)" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      - name: Build Audio
        id: aud
        if: steps.gen.outputs.EP_FILE != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST_MODE: "0"
        run: |
          python scripts/story_audio.py \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "out/${{ steps.gen.outputs.EP_NAME }}.mp3"

      - name: Build Video
        id: vid
        if: steps.aud.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/story_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}.mp3" \
            "out/${{ steps.gen.outputs.EP_NAME }}_meta.json" \
            "videos/${{ steps.gen.outputs.EP_NAME }}.mp4"

      - name: Upload to Telegram
        id: tg
        if: steps.vid.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          META="out/${{ steps.gen.outputs.EP_NAME }}_meta.json"
          TITLE=$(python -c "import json; print(json.load(open('$META')).get('title','حلقة جديدة'))")
          CAPTION=$(printf "🎬 %s\n\n#قصص_الأنبياء #ملاك_المعرفة" "$TITLE")
          
          VIDEO_PATH="videos/${{ steps.gen.outputs.EP_NAME }}.mp4"
          UPLOAD_PATH="$VIDEO_PATH"
          
          SIZE_BYTES=$(stat -c%s "$VIDEO_PATH")
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          
          if [ "$SIZE_MB" -gt 25 ]; then
            COMPRESSED_PATH="videos/${{ steps.gen.outputs.EP_NAME }}_tg.mp4"
            ffmpeg -y -i "$VIDEO_PATH" -vf "scale=-2:720" -c:v libx264 -b:v 600k -maxrate 800k -bufsize 1200k -preset fast -c:a aac -b:a 64k "$COMPRESSED_PATH"
            UPLOAD_PATH="$COMPRESSED_PATH"
          fi
          
          MAX_RETRIES=3
          ATTEMPT=1
          MSG=""
          
          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            RESP=$(curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "video=@${UPLOAD_PATH}" \
              -F "caption=${CAPTION}" \
              -F "supports_streaming=true")
              
            MSG=$(echo "$RESP" | grep -oP '"message_id":\K[0-9]+' || true)
            if [ -n "$MSG" ]; then break; fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done
          
          if [ -z "$MSG" ]; then exit 1; fi
          echo "MSG_ID=$MSG" >> $GITHUB_OUTPUT

      - name: Update Feed
        if: steps.tg.outputs.MSG_ID != ''
        working-directory: scripts
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -c "
          import json
          from update_feed import add_video_to_feed
          meta = json.load(open('../out/${{ steps.gen.outputs.EP_NAME }}_meta.json'))
          add_video_to_feed(
              title=meta.get('title', 'حلقة جديدة'),
              description='حلقة جديدة من ملاك المعرفة.',
              video_url='${{ steps.tg.outputs.MSG_ID }}',
              category='قصص الأنبياء',
          )
          "

      - name: Finalize State
        if: steps.tg.outputs.MSG_ID != ''
        run: python scripts/finalize_episode.py "${{ steps.gen.outputs.EP_FILE }}"

      - name: Commit State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A state/ || true
          git commit -m "🎬 ${{ steps.gen.outputs.EP_NAME || 'daily run' }}" || echo "لا تغييرات"
          git push || true

      - name: Cleanup
        if: always()
        run: |
          rm -rf videos/*.mp4 out/*.mp3 out/*_meta.json
          rm -rf data/stories/generated/*.json
          rm -f out/latest_episode.txt
