name: Daily Video Factory

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg + Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-noto-core libraqm0
          fc-list :lang=ar | head -10

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build Story Audio (with SFX)
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/story_audio.py

      - name: Upload story audio artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-episode-01-audio
          path: out/episode-01.mp3
          retention-days: 7

      - name: Build Story Video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/story_video.py

      - name: Upload story video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-episode-01-video
          path: out/episode-01.mp4
          retention-days: 7

      - name: Run factory (Daily Short)
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/main.py
