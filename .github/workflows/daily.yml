name: Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # زيادة الوقت لبناء فيديوين

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-hosny-amiri espeak-ng libespeak-ng1
          pip install --upgrade pip
          pip install requests edge-tts pillow arabic-reshaper huggingface_hub quranic-phonemizer
          pip install --force-reinstall phonemizer==3.2.1

      - name: Generate Story
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u scripts/generate_story.py
          if [ -f out/latest_episode.txt ]; then
            EP_FILE=$(cat out/latest_episode.txt)
            echo "EP_FILE=$EP_FILE" >> $GITHUB_OUTPUT
            echo "EP_NAME=$(basename "$EP_FILE" .json)" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      # 🌟 بناء صوت اليوتيوب (جيميني)
      - name: Build Audio (YouTube - Gemini)
        id: aud_yt
        if: steps.gen.outputs.EP_FILE != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TEST_MODE: "0"
        run: |
          python scripts/story_audio.py \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "out/${{ steps.gen.outputs.EP_NAME }}_yt.mp3" \
            "youtube"

      # 🌟 بناء صوت السوشيال ميديا (بشري)
      - name: Build Audio (Social - Human)
        id: aud_soc
        if: steps.gen.outputs.EP_FILE != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TEST_MODE: "0"
        run: |
          python scripts/story_audio.py \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "out/${{ steps.gen.outputs.EP_NAME }}_social.mp3" \
            "social"

      # 🌟 بناء فيديو اليوتيوب
      - name: Build Video (YouTube)
        id: vid_yt
        if: steps.aud_yt.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/story_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}_yt.mp3" \
            "out/${{ steps.gen.outputs.EP_NAME }}_yt_meta.json" \
            "videos/${{ steps.gen.outputs.EP_NAME }}_yt.mp4"

      # 🌟 بناء فيديو السوشيال ميديا
      - name: Build Video (Social)
        id: vid_soc
        if: steps.aud_soc.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/story_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}_social.mp3" \
            "out/${{ steps.gen.outputs.EP_NAME }}_social_meta.json" \
            "videos/${{ steps.gen.outputs.EP_NAME }}_social.mp4"

      # 🌟 الرفع إلى تلغرام (مع ضغط الفيديو ليكون أقل من 50 ميجا)
      - name: Upload to Telegram (Both with Compression)
        if: steps.vid_yt.outcome == 'success' && steps.vid_soc.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          META="out/${{ steps.gen.outputs.EP_NAME }}_yt_meta.json"
          TITLE=$(python -c "import json; print(json.load(open('$META')).get('title','حلقة جديدة'))")
          
          # --- 1. معالجة وضغط فيديو اليوتيوب ---
          YT_VIDEO="videos/${{ steps.gen.outputs.EP_NAME }}_yt.mp4"
          YT_UPLOAD="$YT_VIDEO"
          SIZE=$(stat -c%s "$YT_VIDEO")
          if [ $((SIZE / 1024 / 1024)) -gt 45 ]; then
            echo "ضغط فيديو اليوتيوب..."
            YT_COMPRESSED="videos/${{ steps.gen.outputs.EP_NAME }}_yt_tg.mp4"
            ffmpeg -y -i "$YT_VIDEO" -vf "scale=-2:720" -c:v libx264 -b:v 600k -maxrate 800k -bufsize 1200k -preset fast -c:a aac -b:a 64k "$YT_COMPRESSED"
            YT_UPLOAD="$YT_COMPRESSED"
          fi
          
          # إرسال نسخة اليوتيوب
          CAPTION_YT=$(printf "🎬 [نسخة اليوتيوب - جيميني]\n%s\n\n#قصص_الأنبياء #ملاك_المعرفة" "$TITLE")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${YT_UPLOAD}" \
            -F "caption=${CAPTION_YT}" \
            -F "supports_streaming=true"
            
          # --- 2. معالجة وضغط فيديو السوشيال ميديا ---
          SOC_VIDEO="videos/${{ steps.gen.outputs.EP_NAME }}_social.mp4"
          SOC_UPLOAD="$SOC_VIDEO"
          SIZE=$(stat -c%s "$SOC_VIDEO")
          if [ $((SIZE / 1024 / 1024)) -gt 45 ]; then
            echo "ضغط فيديو السوشيال..."
            SOC_COMPRESSED="videos/${{ steps.gen.outputs.EP_NAME }}_social_tg.mp4"
            ffmpeg -y -i "$SOC_VIDEO" -vf "scale=-2:720" -c:v libx264 -b:v 600k -maxrate 800k -bufsize 1200k -preset fast -c:a aac -b:a 64k "$SOC_COMPRESSED"
            SOC_UPLOAD="$SOC_COMPRESSED"
          fi
          
          # إرسال نسخة السوشيال ميديا
          CAPTION_SOC=$(printf "🎬 [نسخة فيسبوك/تيك توك - بشري]\n%s\n\n#قصص_الأنبياء #ملاك_المعرفة" "$TITLE")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${SOC_UPLOAD}" \
            -F "caption=${CAPTION_SOC}" \
            -F "supports_streaming=true"

      - name: Cleanup
        if: always()
        run: |
          rm -rf videos/*.mp4 out/*.mp3 out/*_meta.json
          rm -rf data/stories/generated/*.json
          rm -f out/latest_episode.txt
          rm -rf out/audio_cache
