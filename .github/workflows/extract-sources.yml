name: Extract Sources

on:
  workflow_dispatch:

jobs:
  run-extraction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          path: factory

      - name: Checkout Platform
        uses: actions/checkout@v4
        with:
          repository: qamarsyria/qamar-malak
          token: ${{ secrets.GH_PAT }}
          path: platform

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Extraction
        run: node scripts/extract_sources.js
        working-directory: factory
        env:
          PLATFORM_ROOT: ${{ github.workspace }}/platform

      - name: Commit Changes
        run: |
          cd factory
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto-generated/sources.json
          git commit -m "Extract sources" || echo "No changes"
          git push
