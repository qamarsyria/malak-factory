name: Fetch Music

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install requests

      - name: Fetch music
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/fetch_music.py

      - name: Show result
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          echo "الموسيقى:"
          ls -lh assets/audio/music/ 2>/dev/null | head -20 || echo "لا يوجد"
          echo ""
          echo "المؤثرات:"
          find assets/audio/sfx/ -type f 2>/dev/null | head -30 || echo "لا يوجد"

      - name: Commit music
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: fetch music and sfx from Pixabay"
            git push
          fi
