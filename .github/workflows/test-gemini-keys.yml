name: Test Gemini Keys

on:
  workflow_dispatch:

jobs:
  test-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install requests
        run: pip install requests

      - name: Test each key with multiple models
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python3 -c "
          import os, requests
          keys = os.getenv('GEMINI_API_KEYS', '').split(',')
          models = ['gemini-3.8-flash', 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-pro']
          print(f'Testing {len(keys)} keys...')
          
          for i, key in enumerate(keys):
              key = key.strip()
              if not key: continue
              print(f'--- Key {i+1}: {key[:10]}... ---')
              
              success = False
              for model in models:
                  url = f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}'
                  body = {'contents': [{'parts': [{'text': 'Say OK'}]}]}
                  try:
                      r = requests.post(url, json=body, timeout=30)
                      if r.status_code == 200:
                          print(f'✅ Key {i+1} VALID with model: {model}')
                          success = True
                          break
                      elif r.status_code == 429:
                          print(f'   ⚠️ {model}: Rate limit (quota exhausted)')
                          continue
                      elif r.status_code == 404:
                          # Model not found, try next
                          continue
                      else:
                          print(f'   ❌ {model}: HTTP {r.status_code}')
                          continue
                  except Exception as e:
                      print(f'   ❌ {model}: {e}')
                      continue
              
              if not success:
                  print(f'❌ Key {i+1}: FAILED with all models')
          "
