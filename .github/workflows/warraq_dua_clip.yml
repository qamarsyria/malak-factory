name: 🤲 تطبيق دعاء خاشع على فيديو الوراق

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: 'مسار الفيديو داخل المستودع (مثلاً: warraq_clip.mp4)'
        required: true
        default: 'warraq_clip.mp4'
        type: string
      tts_voice:
        description: 'نبرة صوت الدعاء (هادئة ووقورة بدون مبالغة)'
        required: true
        default: 'Charon'
        type: choice
        options:
          - Charon
          - Orus
          - Algieba
          - Rasalgethi
      show_text:
        description: 'إظهار الدعاء والعنوان مكتوباً على الفيديو؟'
        required: true
        default: true
        type: boolean
      layout_mode:
        description: 'تكييف الأبعاد (auto_vertical يحافظ على كامل المشهد العرضي بخلفية مموهة)'
        required: true
        default: 'auto_vertical'
        type: choice
        options:
          - auto_vertical
          - fill_crop
      video_quality:
        description: 'جودة الفيديو (high_clean ~7-12MB بلا تكسير | compact ~5-7MB)'
        required: true
        default: 'high_clean'
        type: choice
        options:
          - high_clean
          - compact

jobs:
  apply_dua_to_clip:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-hosny-amiri libraqm-dev libfribidi-dev libharfbuzz-dev

      - name: Install Python deps
        run: |
          pip install -q requests==2.32.3 "Pillow>=10.0.0,<11.0.0" arabic-reshaper==3.0.0 python-bidi==0.6.3 edge-tts

      - name: Build Silent-Original + Humble Dua Reel
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_PATH: ${{ inputs.video_path }}
          TTS_VOICE: ${{ inputs.tts_voice }}
          SHOW_TEXT: ${{ inputs.show_text }}
          LAYOUT_MODE: ${{ inputs.layout_mode }}
          VIDEO_QUALITY: ${{ inputs.video_quality }}
        run: |
          cat <<'PYEOF' > /tmp/warraq_dua_clip.py
          import asyncio
          import io
          import json
          import math
          import os
          import subprocess
          import sys
          import tempfile
          import shutil
          from pathlib import Path
          import requests
          from PIL import Image, ImageDraw, ImageFilter, ImageFont, features
          import arabic_reshaper

          try:
              from bidi.algorithm import get_display as bidi_display
          except ImportError:
              from bidi import get_display as bidi_display

          REPO_ROOT = Path.cwd()
          sys.path.insert(0, str(REPO_ROOT / "scripts"))

          try:
              from gemini_tts_pool import gemini_tts_with_pool
          except Exception:
              gemini_tts_with_pool = None

          W, H = 720, 1280
          HAS_RAQM = features.check("raqm")
          VIDEO_PATH = os.getenv("VIDEO_PATH", "warraq_clip.mp4").strip()
          TTS_VOICE = os.getenv("TTS_VOICE", "Charon").strip()
          SHOW_TEXT = os.getenv("SHOW_TEXT", "true").strip().lower() == "true"
          LAYOUT_MODE = os.getenv("LAYOUT_MODE", "auto_vertical").strip()
          VIDEO_QUALITY = os.getenv("VIDEO_QUALITY", "high_clean").strip()

          ACCOUNT_NAME = "لاحول ولاقوة الا بالله"
          HEADER_TEXT = "عَزَاءٌ وَدُعَاءٌ مِنْ أَهْلِ الْمَوْصِلِ بِالْعِرَاقِ إِلَى أَهْلِنَا فِي مِصْرَ"

          DUA_LINES = [
              "اللَّهُمَّ رَبَّنَا وَمَوْلَانَا، يَا مَنْ بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ، إِلَيْكَ نَرْفَعُ أَكُفَّ الضَّرَاعَةِ وَالدُّعَاءِ فِي مُصَابِ أَهْلِنَا بِمِصْرَ فِي فَاجِعَةِ الْوَرَّاقِ.",
              "اللَّهُمَّ تَغَمَّدِ الضَّحَايَا بِوَاسِعِ رَحْمَتِكَ، وَتَقَبَّلْهُمْ عِنْدَكَ فِي الشُّهَدَاءِ، وَاجْعَلِ النَّارَ عَلَيْهِمْ بَرْدًا وَسَلَامًا، وَأَبْدِلْهُمْ دَارًا خَيْرًا مِنْ دَارِهِمْ.",
              "اللَّهُمَّ الطُفْ بِالْمُصَابِينَ وَالْجَرْحَى، وَأَنْزِلْ عَلَيْهِمْ شِفَاءَكَ الْعَاجِلَ، وَرُدَّهُمْ إِلَى أَهْلِهِمْ سَالِمِينَ غَانِمِينَ بِعَافِيَتِكَ.",
              "اللَّهُمَّ أَفْرِغْ عَلَى قُلُوبِ ذَوِيهِمْ صَبْرًا وَسَكِينَةً، وَاجْبُرْ كَسْرَهُمْ، وَثَبِّتْ قُلُوبَهُمْ عِنْدَ الصَّدْمَةِ الْأُولَى.",
              "اللَّهُمَّ هَذَا دُعَاؤُنَا وَعَزَاؤُنَا الصَّادِقُ مِنْ قُلُوبِ أَهْلِ الْمَوْصِلِ فِي الْعِرَاقِ إِلَى أَحِبَّتِنَا فِي مِصْرَ الْعَزِيزَةِ، فَاحْفَظْ مِصْرَ وَأَهْلَهَا مِنْ كُلِّ مَكْرُوهٍ.",
              "وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، وَإِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ.",
          ]


          def run_cmd(cmd: list[str]):
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode != 0:
                  raise RuntimeError(f"فشل الأمر {' '.join(cmd[:4])}:\n{res.stderr[-800:]}")


          def find_bold_font() -> str:
              for p in (
                  "/usr/share/fonts/opentype/fonts-hosny-amiri/Amiri-Bold.ttf",
                  "/usr/share/fonts/truetype/hosny-amiri/Amiri-Bold.ttf",
                  "/usr/share/fonts/truetype/amiri/Amiri-Bold.ttf",
              ):
                  if os.path.exists(p):
                      return p
              r = subprocess.run(["fc-list", ":lang=ar", "--format=%{file}\n"], capture_output=True, text=True)
              for line in r.stdout.splitlines():
                  if os.path.exists(line.strip()):
                      return line.strip()
              raise RuntimeError("لم يُعثر على خط عربي")


          def load_moon_icon(size: int = 28) -> Image.Image:
              # تحميل إيموجي القمر الملون (Noto/Twemoji 1f316 مطابق لصورة الحساب) مع بديل متجهي نقي
              for url in (
                  "https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/128/emoji_u1f316.png",
                  "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f316.png",
              ):
                  try:
                      r = requests.get(url, timeout=15)
                      if r.status_code == 200 and len(r.content) > 500:
                          im = Image.open(io.BytesIO(r.content)).convert("RGBA")
                          return im.resize((size, size), Image.Resampling.LANCZOS)
                  except Exception:
                      pass

              # بديل إجرائي 128x128 لقمر مضيء يساراً ومظلل يميناً
              hi = 128
              cx, cy, rad = 64.0, 64.0, 56.0
              im = Image.new("RGBA", (hi, hi), (0, 0, 0, 0))
              px = im.load()
              for py in range(hi):
                  for p_x in range(hi):
                      dx = p_x - cx
                      dy = py - cy
                      d = math.hypot(dx, dy)
                      if d <= rad + 1.0:
                          alpha = 255 if d <= rad - 0.5 else int(max(0, min(255, (rad + 1.0 - d) * 170)))
                          term = 0.28 * math.sqrt(max(0.0, rad * rad - dy * dy))
                          if dx <= term:
                              px[p_x, py] = (250, 206, 72, alpha)
                          else:
                              px[p_x, py] = (58, 62, 76, alpha)
              return im.resize((size, size), Image.Resampling.LANCZOS)


          def probe_video(path: Path) -> tuple[int, int, float, int]:
              r = subprocess.run(
                  ["ffprobe", "-v", "error", "-select_streams", "v:0",
                   "-show_entries", "stream=width,height,r_frame_rate,sample_aspect_ratio,side_data_list:stream_tags=rotate",
                   "-show_entries", "format=duration",
                   "-of", "json", str(path)],
                  capture_output=True, text=True, check=True,
              )
              info = json.loads(r.stdout)
              st = info["streams"][0]
              vw, vh = int(st["width"]), int(st["height"])

              rot = 0
              tags = st.get("tags") or {}
              if "rotate" in tags:
                  try:
                      rot = abs(int(float(tags["rotate"])))
                  except Exception:
                      pass
              for sd in st.get("side_data_list") or []:
                  if "rotation" in sd:
                      try:
                          rot = abs(int(float(sd["rotation"])))
                      except Exception:
                          pass
              if rot in (90, 270):
                  vw, vh = vh, vw

              fps_raw = str(st.get("r_frame_rate") or "30/1")
              try:
                  num, den = fps_raw.split("/")
                  src_fps = float(num) / max(1.0, float(den))
              except Exception:
                  src_fps = 30.0
              target_fps = max(24, min(30, round(src_fps)))

              dur = float(info["format"]["duration"])
              return vw, vh, dur, target_fps


          def get_dur(path: Path) -> float:
              r = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=noprint_wrappers=1:nokey=1", str(path)],
                  capture_output=True, text=True,
              )
              return max(0.0, float(r.stdout.strip() or 0.0))


          def synth_dua_sentence(text: str, out_wav: Path, work_dir: Path, idx: int):
              raw_mp3 = work_dir / f"dua_{idx}.mp3"
              ok = False
              if gemini_tts_with_pool is not None:
                  try:
                      gemini_tts_with_pool(text, str(raw_mp3), voice=TTS_VOICE)
                      ok = raw_mp3.exists() and raw_mp3.stat().st_size > 1000
                  except Exception as e:
                      print(f"⚠️ Gemini TTS فشل ({e}) — التحويل للاحتياط Edge TTS", flush=True)
              if not ok:
                  import edge_tts
                  async def _run():
                      comm = edge_tts.Communicate(text, "ar-EG-ShakirNeural", rate="-8%")
                      await comm.save(str(raw_mp3))
                  asyncio.run(_run())

              af = (
                  "silenceremove=start_periods=1:start_duration=0:start_threshold=-48dB,"
                  "areverse,"
                  "silenceremove=start_periods=1:start_duration=0:start_threshold=-48dB,"
                  "areverse,"
                  "atempo=0.95,"
                  "highpass=f=80,lowpass=f=9500,"
                  "equalizer=f=220:t=q:w=1.2:g=2.5,"
                  "equalizer=f=4800:t=q:w=1.5:g=-1.5,"
                  "loudnorm=I=-16:TP=-1.5:LRA=11,"
                  "alimiter=limit=0.95"
              )
              run_cmd([
                  "ffmpeg", "-y", "-i", str(raw_mp3), "-af", af,
                  "-ar", "24000", "-ac", "1", "-c:a", "pcm_s16le", str(out_wav),
              ])


          def _load_font(path: str, size: int):
              if HAS_RAQM:
                  return ImageFont.truetype(path, size, layout_engine=ImageFont.Layout.RAQM)
              return ImageFont.truetype(path, size)


          def _prep_txt(line: str) -> str:
              return line if HAS_RAQM else bidi_display(arabic_reshaper.reshape(line))


          def _bbox(draw, line: str, font):
              txt = _prep_txt(line)
              if HAS_RAQM:
                  return draw.textbbox((0, 0), txt, font=font, direction="rtl")
              return draw.textbbox((0, 0), txt, font=font)


          def _draw_center(draw, y: int, line: str, font, fill):
              txt = _prep_txt(line)
              if HAS_RAQM:
                  bb = draw.textbbox((0, 0), txt, font=font, direction="rtl")
                  x = (W - (bb[2] - bb[0])) // 2 - bb[0]
                  draw.text((x, y), txt, font=font, fill=fill, direction="rtl")
              else:
                  bb = draw.textbbox((0, 0), txt, font=font)
                  x = (W - (bb[2] - bb[0])) // 2 - bb[0]
