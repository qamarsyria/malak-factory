name: 🕯️ ريلز حادث الوراق (30ث حقيقي + 20ث تكملة)

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: 'اسم/مسار فيديوك ذو الـ 30 ثانية داخل المستودع'
        required: true
        default: 'warraq_30s.mp4'
        type: string
      video_url:
        description: 'اختياري: رابط مباشر للفيديو بدل مسار المستودع (اتركه فارغاً لاستخدام الملف المرفوع)'
        required: false
        default: ''
        type: string
      ayah_set:
        description: 'الآيات في بداية الفيديو'
        required: true
        default: 'qaf_19_20'
        type: choice
        options:
          - qaf_19_20
          - alfajr_27_30
          - taghabun_11
      reciter:
        description: 'القارئ للآيات'
        required: true
        default: 'Yasser_Ad-Dussary_128kbps'
        type: choice
        options:
          - Yasser_Ad-Dussary_128kbps
          - Nasser_Alqatami_128kbps
          - Minshawy_Murattal_128kbps
          - Alafasy_128kbps
          - Ghamadi_40kbps
      tts_voice:
        description: 'نبرة صوت الدعاء (هادئة ووقورة بدون مبالغة)'
        required: true
        default: 'Charon'
        type: choice
        options: [Charon, Orus, Algieba, Rasalgethi]
      layout_mode:
        description: 'تكييف أبعاد فيديوك (auto_vertical يحفظ كامل العرضي بخلفية مموهة)'
        required: true
        default: 'auto_vertical'
        type: choice
        options: [auto_vertical, fill_crop]
      video_size:
        description: 'جودة وحجم الفيديو'
        required: true
        default: 'balanced'
        type: choice
        options: [balanced, compact, high]

jobs:
  build_hybrid_reel:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-hosny-amiri libraqm-dev libfribidi-dev libharfbuzz-dev
          pip install -q requests==2.32.3 "Pillow>=10.0.0,<11.0.0" arabic-reshaper==3.0.0 python-bidi==0.6.3 edge-tts numpy

      - name: Build 50s Hybrid Reel (Silent Original + 20s AI Verified)
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_PATH: ${{ inputs.video_path }}
          VIDEO_URL: ${{ inputs.video_url }}
          AYAH_SET: ${{ inputs.ayah_set }}
          RECITER_ID: ${{ inputs.reciter }}
          TTS_VOICE: ${{ inputs.tts_voice }}
          LAYOUT_MODE: ${{ inputs.layout_mode }}
          VIDEO_SIZE: ${{ inputs.video_size }}
        run: |
          python -u - <<'PYEOF'
          import asyncio, base64, io, json, math, os, re, shutil, subprocess, sys, tempfile, time
          from pathlib import Path
          import numpy as np
          import requests
          from PIL import Image, ImageDraw, ImageFilter, ImageFont, ImageOps, features
          import arabic_reshaper

          try:
              from bidi.algorithm import get_display as bidi_display
          except ImportError:
              from bidi import get_display as bidi_display

          REPO_ROOT = Path.cwd()
          sys.path.insert(0, str(REPO_ROOT / "scripts"))
          try:
              from gemini_tts_pool import gemini_tts_with_pool, get_pool
          except Exception:
              gemini_tts_with_pool, get_pool = None, None
          try:
              from model_discovery import discover_and_cache
          except Exception:
              discover_and_cache = None

          W, H, FPS = 720, 1280, 30
          HAS_RAQM = features.check("raqm")
          PIXABAY_KEY = os.getenv("PIXABAY_API_KEY", "").strip()
          VIDEO_PATH = os.getenv("VIDEO_PATH", "warraq_30s.mp4").strip()
          VIDEO_URL = os.getenv("VIDEO_URL", "").strip()
          AYAH_SET = os.getenv("AYAH_SET", "qaf_19_20").strip()
          RECITER_ID = os.getenv("RECITER_ID", "Yasser_Ad-Dussary_128kbps").strip()
          TTS_VOICE = os.getenv("TTS_VOICE", "Charon").strip()
          LAYOUT_MODE = os.getenv("LAYOUT_MODE", "auto_vertical").strip()
          VIDEO_SIZE = os.getenv("VIDEO_SIZE", "balanced").strip()

          RECITER_LABELS = {
              "Yasser_Ad-Dussary_128kbps": "ياسر الدوسري",
              "Nasser_Alqatami_128kbps": "ناصر القطامي",
              "Minshawy_Murattal_128kbps": "محمد صديق المنشاوي",
              "Alafasy_128kbps": "مشاري راشد العفاسي",
              "Ghamadi_40kbps": "سعد الغامدي",
          }

          AYAH_PRESETS = {
              "qaf_19_20": {
                  "surah": 50, "sname": "ق",
                  "caption": "﴿ وَجَاءَتْ سَكْرَةُ الْمَوْتِ بِالْحَقِّ ۖ ذَٰلِكَ مَا كُنتَ مِنْهُ تَحِيدُ ۝ وَنُفِخَ فِي الصُّورِ ۚ ذَٰلِكَ يَوْمُ الْوَعِيدِ ﴾",
                  "ayahs": [
                      (19, "وَجَآءَتْ سَكْرَةُ ٱلْمَوْتِ بِٱلْحَقِّ ۖ ذَٰلِكَ مَا كُنتَ مِنْهُ تَحِيدُ"),
                      (20, "وَنُفِخَ فِى ٱلصُّورِ ۚ ذَٰلِكَ يَوْمُ ٱلْوَعِيدِ"),
                  ],
              },
              "alfajr_27_30": {
                  "surah": 89, "sname": "الفجر",
                  "caption": "﴿ يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ ۝ ارْجِعِي إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً ﴾",
                  "ayahs": [
                      (27, "يَـٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ"),
                      (28, "ٱرْجِعِىٓ إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً"),
                      (29, "فَٱدْخُلِى فِى عِبَـٰدِى"),
                      (30, "وَٱدْخُلِى جَنَّتِى"),
                  ],
              },
              "taghabun_11": {
                  "surah": 64, "sname": "التغابن",
                  "caption": "﴿ مَا أَصَابَ مِن مُّصِيبَةٍ إِلَّا بِإِذْنِ اللَّهِ ۗ وَمَن يُؤْمِن بِاللَّهِ يَهْدِ قَلْبَهُ ﴾",
                  "ayahs": [
                      (11, "مَآ أَصَابَ مِن مُّصِيبَةٍ إِلَّا بِإِذْنِ ٱللَّهِ ۗ وَمَن يُؤْمِنۢ بِٱللَّهِ يَهْدِ قَلْبَهُۥ ۚ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌ"),
                  ],
              },
          }

          ACCOUNT_NAME = "لاحول ولاقوة الا بالله"
          HEADER_TEXT = "عَزَاءٌ وَدُعَاءٌ مِنْ أَهْلِ الْمَوْصِلِ بِالْعِرَاقِ إِلَى أَهْلِنَا فِي مِصْرَ"
          DUA_LINES = [
              "اللَّهُمَّ آنِسْ وَحْشَةَ ضَحَايَا حَرِيقِ الْوَرَّاقِ، وَتَقَبَّلْهُمْ فِي الشُّهَدَاءِ، وَاجْعَلْ مَأْوَاهُمُ الْجَنَّةَ.",
              "يَا شَافِي، اشْفِ الْمُصَابِينَ، وَأَنْزِلِ الصَّبْرَ وَالسَّكِينَةَ عَلَى قُلُوبِ أَهْلِهِمْ وَذَوِيهِمْ.",
              "عَزَاؤُنَا مِنْ أَهْلِ الْمَوْصِلِ بِالْعِرَاقِ إِلَى أَهْلِنَا فِي مِصْرَ، حَفِظَ اللَّهُ مِصْرَ وَأَهْلَهَا، آمِينَ.",
          ]

          BAD_TAGS = {
              "animation", "cartoon", "3d", "cgi", "illustration", "drawing", "abstract",
              "fireplace", "campfire", "bonfire", "candle", "candles", "birthday", "bbq",
              "grill", "cooking", "kitchen", "fireworks", "sparkler", "sparklers", "lighter",
              "insect", "bug", "fly", "bee", "berry", "fruit", "food", "macro", "flower",
              "woman", "girl", "female", "man", "men", "boy", "person", "people", "human",
              "face", "portrait", "crowd", "wedding", "party", "concert", "dance", "bikini",
          }

          # 3 مشاهد واقعية مكملة للـ 20 ثانية الأخيرة (مفحوصة بلوحة مجمعة بـ Gemini Vision)
          COMPLEMENTARY_SHOTS = [
              {
                  "name": "إطفاء وإسعاف وطوارئ ليلية",
                  "px_vids": ["fire truck night emergency", "emergency flashing lights night"],
                  "wiki": ["firefighters car fire night", "firefighter burning vehicle hose", "fire truck night fire"],
                  "req": "Real firefighters fighting a vehicle/road fire or fire truck / ambulance emergency lights at night (NO campfires, NO fireworks, NO insects).",
              },
              {
                  "name": "دخان أسود كثيف وسيارات محترقة",
                  "px_vids": ["black smoke fire rising", "dark smoke burning"],
                  "wiki": ["burned car wreck fire", "black smoke car fire", "charred vehicles fire aftermath"],
                  "req": "Thick black disaster fire smoke or burned-out charred vehicle wreckage on road (NO campfires, NO cozy scenes, NO insects).",
              },
              {
                  "name": "مسجد ليلاً للدعاء لمصر",
                  "px_vids": ["mosque night", "mosque dawn"],
                  "wiki": ["Cairo mosque night", "Al-Azhar mosque night"],
                  "req": "Serene respectful mosque dome and minaret at night or dawn for prayer.",
              },
          ]

          def run_cmd(cmd):
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode != 0:
                  raise RuntimeError(f"فشل {' '.join(cmd[:4])}:\n{res.stderr[-800:]}")

          def _vision_models():
              ms = []
              if discover_and_cache is not None:
                  try:
                      for m in discover_and_cache(force=False):
                          bm = m.removeprefix("models/").strip()
                          if bm and not any(x in bm.lower() for x in ("tts", "embedding", "imagen", "nano", "omni", "live")):
                              ms.append(bm)
                  except Exception:
                      pass
              for fb in ("gemini-2.5-flash", "gemini-3.8-flash", "gemini-3.8-flash-lite"):
                  if fb not in ms: ms.append(fb)
              return ms[:2]

          def pick_best_from_sheet(candidates, req, scene_idx):
              if not candidates:
                  return None
              if len(candidates) == 1 or get_pool is None:
                  return candidates[0]
              cols, rows = 3, math.ceil(len(candidates) / 3)
              tw, th = 360, 240
              sheet = Image.new("RGB", (cols * tw, rows * th), (15, 15, 18))
              draw = ImageDraw.Draw(sheet)
              try:
                  nf = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 34)
              except Exception:
                  nf = ImageFont.load_default()
              for idx, cand in enumerate(candidates):
                  r_i, c_i = divmod(idx, cols)
                  sheet.paste(ImageOps.fit(cand["thumb"], (tw, th), method=Image.Resampling.LANCZOS), (c_i * tw, r_i * th))
                  x0, y0 = c_i * tw + 8, r_i * th + 8
                  draw.rectangle([x0, y0, x0 + 46, y0 + 42], fill=(0, 0, 0))
                  draw.text((x0 + 12, y0 + 4), str(idx + 1), fill=(255, 220, 40), font=nf)

              buf = io.BytesIO()
              sheet.save(buf, "JPEG", quality=85)
              b64 = base64.b64encode(buf.getvalue()).decode("ascii")
              prompt = (
                  f"Selecting realistic documentary footage for a tragic highway fuel-tanker fire disaster Reel.\n"
                  f"Target scene: {req}\n"
                  f"Pick tile 1..{len(candidates)} that best matches realistically. STRICTLY AVOID fireworks, campfires, candles, insects/animals, cartoons, smiling faces, or giant TV logos.\n"
                  'Reply JSON only: {"best_tile": 1, "score": 8, "reason": "short description"}'
              )
              pool = get_pool()
              for model in _vision_models():
                  try:
                      key = pool.get_current()
                      if not key: break
                      r = requests.post(
                          f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}",
                          json={"contents": [{"parts": [{"inlineData": {"mimeType": "image/jpeg", "data": b64}}, {"text": prompt}]}], "generationConfig": {"temperature": 0.1, "maxOutputTokens": 250, "responseMimeType": "application/json"}},
                          timeout=25,
                      )
                      if r.status_code == 200:
                          cands = r.json().get("candidates") or []
                          if cands:
                              txt = "".join(p.get("text", "") for p in cands[0].get("content", {}).get("parts", []) if not p.get("thought"))
                              s, e = txt.find("{"), txt.rfind("}")
                              if s != -1 and e > s:
                                  obj = json.loads(txt[s:e + 1])
                                  pick = int(obj.get("best_tile", 1))
                                  if hasattr(pool, "_advance"): pool._advance()
                                  if 1 <= pick <= len(candidates):
                                      print(f"   👁️ اختيار اللوحة #{pick}/{len(candidates)} ({obj.get('score')}/10): {str(obj.get('reason',''))[:80]}", flush=True)
                                      return candidates[pick - 1]
                      elif r.status_code in (401, 403):
                          pool.mark_dead(f"HTTP {r.status_code}")
                      elif r.status_code == 429:
                          if hasattr(pool, "_advance"): pool._advance()
                          time.sleep(1)
                  except Exception:
                      if hasattr(pool, "_advance"): pool._advance()
                      continue
              return candidates[0]

          def _clean_tags(tags):
              return len(set(re.split(r"[^a-z0-9]+", (tags or "").lower())) & BAD_TAGS) == 0

          def gather_candidates(shot_cfg, used_urls):
              candidates = []
              for wq in shot_cfg.get("wiki", []):
                  if len(candidates) >= 6: break
                  try:
                      r = requests.get(
                          "https://commons.wikimedia.org/w/api.php",
                          headers={"User-Agent": "AlWarraqDocBot/1.0 (https://github.com/qamarsyria/malak-factory)"},
                          params={"action": "query", "generator": "search", "gsrsearch": f"{wq} filetype:bitmap", "gsrnamespace": "6", "gsrlimit": "6", "prop": "imageinfo", "iiprop": "url|size|mime", "iiurlwidth": "960", "format": "json"},
                          timeout=12,
                      )
                      if r.status_code != 200: continue
                      for p in list((r.json().get("query") or {}).get("pages", {}).values())[:4]:
                          ii = (p.get("imageinfo") or [{}])[0]
                          if str(ii.get("mime", "")) not in ("image/jpeg", "image/png"): continue
                          url = ii.get("thumburl") or ii.get("url")
                          if not url or url in used_urls: continue
                          resp = requests.get(url, headers={"User-Agent": "AlWarraqDocBot/1.0"}, timeout=15)
                          if resp.status_code != 200: continue
                          with Image.open(io.BytesIO(resp.content)) as im:
                              im = ImageOps.exif_transpose(im).convert("RGB")
                              if min(im.size) < 380: continue
                              candidates.append({"kind": "image", "url": url, "image": im.copy(), "thumb": im.copy()})
                              if len(candidates) >= 6: break
                  except Exception:
                      pass
              if PIXABAY_KEY and len(candidates) < 6:
                  for q in shot_cfg.get("px_vids", []):
                      if len(candidates) >= 6: break
                      try:
                          r = requests.get("https://pixabay.com/api/videos/", params={"key": PIXABAY_KEY, "q": q, "video_type": "film", "safesearch": "true", "per_page": 10, "min_width": 640}, timeout=12)
                          if r.status_code != 200: continue
                          hits = [h for h in r.json().get("hits", []) if _clean_tags(h.get("tags", "")) and h.get("duration", 0) >= 4]
                          for h in hits[:3]:
                              vids = h.get("videos", {})
                              full_url = vids.get("medium", {}).get("url") or vids.get("large", {}).get("url")
                              tiny_url = vids.get("tiny", {}).get("url") or full_url
                              if not full_url or full_url in used_urls: continue
                              tmp_v, tmp_j = Path(tempfile.gettempdir()) / f"px_t_{h['id']}.mp4", Path(tempfile.gettempdir()) / f"px_t_{h['id']}.jpg"
                              with open(tmp_v, "wb") as f:
                                  for ch in requests.get(tiny_url, timeout=15, stream=True).iter_content(16384): f.write(ch)
                              subprocess.run(["ffmpeg", "-y", "-v", "error", "-ss", "1.0", "-i", str(tmp_v), "-frames:v", "1", "-q:v", "4", str(tmp_j)], capture_output=True)
                              if tmp_j.exists():
                                  with Image.open(tmp_j) as im:
                                      candidates.append({"kind": "video", "url": full_url, "thumb": im.convert("RGB").copy()})
                              tmp_v.unlink(missing_ok=True); tmp_j.unlink(missing_ok=True)
                              if len(candidates) >= 6: break
                      except Exception:
                          pass
              return candidates

          def materialize_winner(cand, work_dir, idx):
              if cand["kind"] == "image":
                  out = work_dir / f"win_{idx}.jpg"
                  cand["image"].save(out, "JPEG", quality=92)
                  return out
              out = work_dir / f"win_{idx}.mp4"
              with open(out, "wb") as f:
                  for ch in requests.get(cand["url"], timeout=45, stream=True).iter_content(16384): f.write(ch)
              return out

          def find_bold_font():
              for p in ("/usr/share/fonts/opentype/fonts-hosny-amiri/Amiri-Bold.ttf", "/usr/share/fonts/truetype/hosny-amiri/Amiri-Bold.ttf", "/usr/share/fonts/truetype/amiri/Amiri-Bold.ttf"):
                  if os.path.exists(p): return p
              r = subprocess.run(["fc-list", ":lang=ar", "--format=%{file}\n"], capture_output=True, text=True)
              for ln in r.stdout.splitlines():
                  if os.path.exists(ln.strip()): return ln.strip()
              raise RuntimeError("لم يُعثر على خط عربي")

          def find_quran_font(cache_dir, fb):
              dst = cache_dir / "AmiriQuran-Regular.ttf"
              for url in ("https://cdn.jsdelivr.net/gh/mohammed-2-5/islamic-library-data@master/fonts/AmiriQuran-Regular.ttf", "https://raw.githubusercontent.com/google/fonts/main/ofl/amiriquran/AmiriQuran-Regular.ttf"):
                  try:
                      r = requests.get(url, timeout=20)
                      if r.status_code == 200 and len(r.content) > 50000:
                          dst.write_bytes(r.content)
                          return str(dst)
                  except Exception:
                      pass
              for p in ("/usr/share/fonts/opentype/fonts-hosny-amiri/AmiriQuran.ttf", "/usr/share/fonts/truetype/hosny-amiri/AmiriQuran.ttf"):
                  if os.path.exists(p): return p
              return fb

          def fetch_uthmani_chapter(surah, fallback_pairs):
              v = {}
              try:
                  r = requests.get(f"https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number={surah}", timeout=15)
                  if r.status_code == 200:
                      for it in r.json().get("verses", []):
                          vk = str(it.get("verse_key", ""))
                          if ":" in vk: v[int(vk.split(":")[1])] = (it.get("text_uthmani") or "").strip()
              except Exception:
                  pass
              for a_num, fb_txt in fallback_pairs:
                  if not v.get(a_num): v[a_num] = fb_txt
              return v

          def load_moon_icon(size=27):
              for url in ("https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/128/emoji_u1f316.png", "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f316.png"):
                  try:
                      r = requests.get(url, timeout=15)
                      if r.status_code == 200 and len(r.content) > 500:
                          return Image.open(io.BytesIO(r.content)).convert("RGBA").resize((size, size), Image.Resampling.LANCZOS)
                  except Exception:
                      pass
              hi, cx, cy, rad = 128, 64.0, 64.0, 56.0
              im = Image.new("RGBA", (hi, hi), (0, 0, 0, 0))
              px = im.load()
              for py in range(hi):
                  for p_x in range(hi):
                      dx, dy = p_x - cx, py - cy
                      d = math.hypot(dx, dy)
                      if d <= rad + 1.0:
                          a = 255 if d <= rad - 0.5 else int(max(0, min(255, (rad + 1.0 - d) * 170)))
                          term = 0.28 * math.sqrt(max(0.0, rad * rad - dy * dy))
                          px[p_x, py] = (250, 206, 72, a) if dx <= term else (58, 62, 76, a)
              return im.resize((size, size), Image.Resampling.LANCZOS)

          def probe_video_info(path):
              r = subprocess.run(["ffprobe", "-v", "error", "-select_streams", "v:0", "-show_entries", "stream=codec_name,width,height,side_data_list:stream_tags=rotate", "-show_entries", "format=duration", "-of", "json", str(path)], capture_output=True, text=True)
              if r.returncode != 0:
                  raise RuntimeError(f"❌ ملف الفيديو غير صالح أو تالف: {path.name}")
              info = json.loads(r.stdout)
              if not info.get("streams"):
                  raise RuntimeError(f"❌ لا يوجد مسار فيديو صالح داخل {path.name}")
              st = info["streams"][0]
              vw, vh = int(st["width"]), int(st["height"])
              rot = 0
              if "rotate" in (st.get("tags") or {}):
                  try: rot = abs(int(float(st["tags"]["rotate"])))
                  except Exception: pass
              for sd in st.get("side_data_list") or []:
                  if "rotation" in sd:
                      try: rot = abs(int(float(sd["rotation"])))
                      except Exception: pass
              if rot in (90, 270): vw, vh = vh, vw
              dur = float(info["format"].get("duration") or 0.0)
              print(f"📹 الفيديو المرفوع: {vw}x{vh} | codec={st.get('codec_name')} | المدة المعلنة={dur:.2f}s (سيُزال صوته 100%)", flush=True)
              return vw, vh, dur

          def get_dur(path):
              r = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", str(path)], capture_output=True, text=True)
              return max(0.0, float(r.stdout.strip() or 0.0))

          def synth_dua_raw(text, out_wav, work_dir, idx):
              raw = work_dir / f"dua_raw_{idx}.mp3"
              ok = False
              if gemini_tts_with_pool is not None:
                  try:
                      gemini_tts_with_pool(text, str(raw), voice=TTS_VOICE)
                      ok = raw.exists() and raw.stat().st_size > 1000
                  except Exception as e:
                      print(f"⚠️ Gemini فشل ({e}) — Edge احتياطي", flush=True)
              if not ok:
                  import edge_tts
                  asyncio.run(edge_tts.Communicate(text, "ar-EG-ShakirNeural", rate="-6%").save(str(raw)))
              af = "silenceremove=start_periods=1:start_duration=0:start_threshold=-48dB,areverse,silenceremove=start_periods=1:start_duration=0:start_threshold=-48dB,areverse,highpass=f=80,lowpass=f=9500,equalizer=f=220:t=q:w=1.2:g=2.5,equalizer=f=4800:t=q:w=1.5:g=-1.5,loudnorm=I=-16:TP=-1.5:LRA=11,alimiter=limit=0.95"
              run_cmd(["ffmpeg", "-y", "-i", str(raw), "-af", af, "-ar", "24000", "-ac", "1", "-c:a", "pcm_s16le", str(out_wav)])

          def download_ayah(surah, ayah, out_wav, work_dir):
              mp3 = work_dir / f"q_{surah}_{ayah}.mp3"
              r = requests.get(f"https://everyayah.com/data/{RECITER_ID}/{surah:03d}{ayah:03d}.mp3", timeout=25)
              if r.status_code != 200 or len(r.content) < 1000:
                  r = requests.get(f"https://everyayah.com/data/Alafasy_128kbps/{surah:03d}{ayah:03d}.mp3", timeout=25)
                  r.raise_for_status()
              mp3.write_bytes(r.content)
              af = "silenceremove=start_periods=1:start_duration=0:start_threshold=-48dB,areverse,silenceremove=start_periods=1:start_duration=0:start_threshold=-48dB,areverse,loudnorm=I=-15:TP=-1.5:LRA=10,alimiter=limit=0.95,afade=t=in:st=0:d=0.015"
              run_cmd(["ffmpeg", "-y", "-i", str(mp3), "-af", af, "-ar", "24000", "-ac", "1", "-c:a", "pcm_s16le", str(out_wav)])

          def _font(p, sz):
              return ImageFont.truetype(p, sz, layout_engine=ImageFont.Layout.RAQM) if HAS_RAQM else ImageFont.truetype(p, sz)

          def _prep(s):
              return s if HAS_RAQM else bidi_display(arabic_reshaper.reshape(s))

          def _bb(draw, s, f):
              return draw.textbbox((0, 0), _prep(s), font=f, direction="rtl") if HAS_RAQM else draw.textbbox((0, 0), _prep(s), font=f)

          def _draw_c(draw, y, s, f, fill):
              txt = _prep(s)
              bb = draw.textbbox((0, 0), txt, font=f, direction="rtl") if HAS_RAQM else draw.textbbox((0, 0), txt, font=f)
              x = (W - (bb[2] - bb[0])) // 2 - bb[0]
              draw.text((x, y), txt, font=f, fill=fill, **({"direction": "rtl"} if HAS_RAQM else {}))

          def _wrap(txt, f, mw, draw):
              lines = []
              for para in txt.splitlines():
                  cur = ""
                  for w in para.split():
                      t = f"{cur} {w}".strip() if cur else w
                      bb = _bb(draw, t, f)
                      if (bb[2] - bb[0]) <= mw: cur = t
                      else:
                          if cur: lines.append(cur)
                          cur = w
                  if cur: lines.append(cur)
              return lines

          def _halo(canvas, fg, r=2, blur=3):
              a = fg.getchannel("A")
              z = Image.new("L", canvas.size, 0)
              oa = a.filter(ImageFilter.MaxFilter(r * 2 + 1))
              sa = oa.filter(ImageFilter.GaussianBlur(blur))
              canvas.alpha_composite(Image.merge("RGBA", (z, z, z, sa)), dest=(0, 3))
              canvas.alpha_composite(Image.merge("RGBA", (z, z, z, oa)))
              canvas.alpha_composite(fg)

          def make_overlay_arrays(body_text, is_quran, bold_p, quran_p, moon, ref_txt="", rec_label=""):
              ov = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              sc = ImageDraw.Draw(ov)
              for y in range(135): sc.line([(0, y), (W, y)], fill=(0, 0, 0, int(155 * (1 - y / 135))))
              for y in range(H - 460, H): sc.line([(0, y), (W, y)], fill=(0, 0, 0, int(195 * (((y - (H - 460)) / 460) ** 1.25))))
              if is_quran: sc.rectangle([0, 0, W, H], fill=(0, 0, 0, 50))

              bfg, mfg = Image.new("RGBA", (W, H), (0, 0, 0, 0)), Image.new("RGBA", (W, H), (0, 0, 0, 0))
              bd, md = ImageDraw.Draw(bfg), ImageDraw.Draw(mfg)
              _draw_c(md, 40, HEADER_TEXT, _font(bold_p, 22), "#E6C667")

              dummy = ImageDraw.Draw(Image.new("RGB", (10, 10)))
              fpath = quran_p if is_quran else bold_p
              ssz, msz, mh, mult = (44, 32, 620, 2.35) if is_quran else (38, 28, 380, 1.75)
              cf, cl, clh = _font(fpath, msz), [], int(msz * mult)
              for sz in range(ssz, msz - 1, -2):
                  f = _font(fpath, sz)
                  ls = _wrap(body_text, f, W - 96, dummy)
                  gh = max((_bb(dummy, ln, f)[3] - _bb(dummy, ln, f)[1] for ln in ls), default=0)
                  lh = max(int(sz * mult), gh + 14)
                  if len(ls) * lh <= mh:
                      cf, cl, clh = f, ls, lh
                      break
              if not cl: cl = _wrap(body_text, cf, W - 96, dummy)

              mtop = min((_bb(bd, ln, cf)[1] for ln in cl), default=0)
              lbot = _bb(bd, cl[-1], cf)[3] if cl else clh
              y = max(175 + max(0, -mtop), (H - len(cl) * clh - 50) // 2) if is_quran else max(220 + max(0, -mtop), H - 155 - len(cl) * clh)
              for ln in cl:
                  _draw_c(bd, y, ln, cf, "#FFE066" if is_quran else "#FFFFFF")
                  y += clh

              if is_quran and ref_txt:
                  _draw_c(md, max(y + 8, (y - clh) + lbot + 18), ref_txt, _font(bold_p, 26), "#D4AF37")
              if is_quran and rec_label:
                  _draw_c(md, H - 130, f"بصوت: الشيخ {rec_label}", _font(bold_p, 23), "#E8D5A0")

              wf = _font(bold_p, 25)
              wtxt = _prep(ACCOUNT_NAME)
              wbb = md.textbbox((0, 0), wtxt, font=wf, direction="rtl") if HAS_RAQM else md.textbbox((0, 0), wtxt, font=wf)
              wy, wx_vis = H - 60, W - (wbb[2] - wbb[0]) - 28
              md.text((wx_vis - wbb[0], wy), wtxt, font=wf, fill="#F5E6B3", **({"direction": "rtl"} if HAS_RAQM else {}))

              _halo(ov, bfg, 2, 3)
              _halo(ov, mfg, 1, 2)

              ix, iy = max(12, wx_vis - moon.width - 7), wy + wbb[1] + ((wbb[3] - wbb[1]) - moon.height) // 2
              z = Image.new("L", moon.size, 0)
              ov.alpha_composite(Image.merge("RGBA", (z, z, z, moon.getchannel("A").filter(ImageFilter.GaussianBlur(2)))), dest=(ix, iy + 2))
              ov.alpha_composite(moon, dest=(ix, iy))

              arr = np.array(ov, dtype=np.uint16)
              a = arr[:, :, 3:4]
              return (255 - a), (arr[:, :, :3] * a)

          def read_shot_frames(media_path, n_frames):
              is_img = media_path.suffix.lower() in (".jpg", ".jpeg", ".png")
              if is_img:
                  vf = f"scale={W*2}:{H*2}:force_original_aspect_ratio=increase,crop={W*2}:{H*2},zoompan=z='min(zoom+0.0010,1.15)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d={n_frames + 10}:s={W}x{H}:fps={FPS},eq=brightness=-0.05:contrast=1.08:saturation=0.90,format=rgb24"
                  cmd = ["ffmpeg", "-v", "error", "-i", str(media_path), "-vf", vf, "-frames:v", str(n_frames), "-f", "rawvideo", "-pix_fmt", "rgb24", "pipe:1"]
              else:
                  vf = f"fps={FPS},scale={W}:{H}:force_original_aspect_ratio=increase:flags=lanczos,crop={W}:{H},eq=brightness=-0.05:contrast=1.08:saturation=0.90,format=rgb24"
                  cmd = ["ffmpeg", "-v", "error", "-an", "-stream_loop", "-1", "-i", str(media_path), "-vf", vf, "-frames:v", str(n_frames), "-f", "rawvideo", "-pix_fmt", "rgb24", "pipe:1"]

              proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              fbytes = W * H * 3
              frames = []
              for _ in range(n_frames):
                  raw = proc.stdout.read(fbytes)
                  if not raw or len(raw) < fbytes:
                      frames.append(frames[-1] if frames else np.zeros((H, W, 3), dtype=np.uint8))
                  else:
                      frames.append(np.frombuffer(raw, dtype=np.uint8).reshape((H, W, 3)).copy())
              proc.stdout.close()
              proc.terminate()
              proc.wait()
              return frames

          def main():
              work = Path(tempfile.mkdtemp(prefix="warraq_hybrid_"))
              try:
                  # 1) تجهيز الفيديو المرفوع (ذو الـ 30 ثانية) وفحص سلامته + كتم صوته نهائياً (-an)
                  if VIDEO_URL:
                      src_clip = work / "uploaded_clip.mp4"
                      print("⬇️ تحميل الفيديو من الرابط المباشر...", flush=True)
                      with open(src_clip, "wb") as f:
                          for ch in requests.get(VIDEO_URL, timeout=90, stream=True).iter_content(16384): f.write(ch)
                  else:
                      src_clip = REPO_ROOT / VIDEO_PATH
                      if not src_clip.exists():
                          raise FileNotFoundError(f"❌ لم يُعثر على الفيديو في المسار '{VIDEO_PATH}'. ارفعه أولاً بنفس الاسم أو ضع رابطاً في video_url.")

                  vw, vh, clip_dur = probe_video_info(src_clip)
                  if clip_dur < 3.0:
                      raise RuntimeError(f"❌ الفيديو المرفوع قصير جداً أو معطوب ({clip_dur:.2f}s).")

                  bold_p = find_bold_font()
                  quran_p = find_quran_font(work, bold_p)
                  moon = load_moon_icon(27)
                  preset = AYAH_PRESETS.get(AYAH_SET, AYAH_PRESETS["qaf_19_20"])
                  surah, sname, pairs = preset["surah"], preset["sname"], preset["ayahs"]
                  verses = fetch_uthmani_chapter(surah, pairs)
                  rec_label = RECITER_LABELS.get(RECITER_ID, RECITER_ID)

                  # 2) بناء الصوت الكامل (سورة قاف 19-20 بالدوسري + الدعاء الهادئ <= 49.5s)
                  q_items, q_dur_sum = [], 0.0
                  for idx, (a_num, _) in enumerate(pairs):
                      w = work / f"q_{idx}.wav"
                      download_ayah(surah, a_num, w, work)
                      gap = 0.45 if idx == len(pairs) - 1 else 0.20
                      d = get_dur(w)
                      q_items.append({"type": "quran", "wav": w, "dur": d, "gap": gap, "text": f"﴿ {verses[a_num]} ﴾", "ref": f"[ سورة {sname} : {a_num} ]"})
                      q_dur_sum += d + gap

                  d_raw_wavs, d_raw_sum = [], 0.0
                  for idx, ln in enumerate(DUA_LINES):
                      w = work / f"draw_{idx}.wav"
                      synth_dua_raw(ln, w, work, idx)
                      d_raw_wavs.append(w)
                      d_raw_sum += get_dur(w)

                  max_total = 49.5
                  dua_gaps_sum = (len(DUA_LINES) - 1) * 0.35 + 0.85
                  dua_budget = max(8.0, (max_total - 0.15) - q_dur_sum - dua_gaps_sum)
                  tempo = max(0.96, min(1.26, d_raw_sum / dua_budget)) if d_raw_sum > dua_budget else 0.98

                  d_items = []
                  for idx, (ln, rw) in enumerate(zip(DUA_LINES, d_raw_wavs)):
                      w = work / f"d_{idx}.wav"
                      run_cmd(["ffmpeg", "-y", "-i", str(rw), "-af", f"atempo={tempo:.4f}", "-ar", "24000", "-ac", "1", "-c:a", "pcm_s16le", str(w)])
                      gap = 0.85 if idx == len(DUA_LINES) - 1 else 0.35
                      d_items.append({"type": "dua", "wav": w, "dur": get_dur(w), "gap": gap, "text": ln})

                  all_items = q_items + d_items
                  q_parts, d_parts, segs, cur = [], [], [], 0.0
                  for idx, it in enumerate(all_items):
                      gw = work / f"gap_{idx}.wav"
                      run_cmd(["ffmpeg", "-y", "-f", "lavfi", "-i", "anullsrc=r=24000:cl=mono", "-t", f"{it['gap']:.3f}", "-c:a", "pcm_s16le", str(gw)])
                      (q_parts if it["type"] == "quran" else d_parts).extend([it["wav"], gw])
                      seg_dur = it["dur"] + it["gap"]
                      segs.append({**it, "t0": cur, "t1": cur + seg_dur})
                      cur += seg_dur

                  qc, dc = work / "qc.txt", work / "dc.txt"
                  qc.write_text("\n".join(f"file '{p.resolve()}'" for p in q_parts), encoding="utf-8")
                  dc.write_text("\n".join(f"file '{p.resolve()}'" for p in d_parts), encoding="utf-8")
                  q_wav, d_dry, d_wav = work / "q.wav", work / "ddry.wav", work / "d.wav"
                  run_cmd(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(qc), "-ar", "24000", "-ac", "1", "-c:a", "pcm_s16le", str(q_wav)])
                  run_cmd(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(dc), "-ar", "24000", "-ac", "1", "-c:a", "pcm_s16le", str(d_dry)])
                  ddur = get_dur(d_dry)
                  run_cmd(["ffmpeg", "-y", "-i", str(d_dry), "-af", f"aecho=0.88:0.86:50|110|175:0.20|0.10|0.04,loudnorm=I=-15:TP=-1.5:LRA=10,alimiter=limit=0.95,afade=t=out:st={max(0.0, ddur - 0.7):.3f}:d=0.7", "-ar", "24000", "-ac", "1", "-c:a", "pcm_s16le", str(d_wav)])

                  full_c, full_wav = work / "fc.txt", work / "full.wav"
                  full_c.write_text(f"file '{q_wav.resolve()}'\nfile '{d_wav.resolve()}'\n", encoding="utf-8")
                  run_cmd(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(full_c), "-ar", "24000", "-ac", "1", "-c:a", "pcm_s16le", str(full_wav)])
                  tdur = min(49.8, get_dur(full_wav))
                  total_frames = max(1, int(round(tdur * FPS)))
                  print(f"⏱️ المدة الإجمالية المستهدفة: {tdur:.2f}s ({total_frames} إطار)", flush=True)

                  ov_layers = [
                      make_overlay_arrays(sg["text"], sg["type"] == "quran", bold_p, quran_p, moon, sg.get("ref", ""), rec_label if sg["type"] == "quran" else "")
                      for sg in segs
                  ]

                  if VIDEO_SIZE == "compact":
                      venc = ["-c:v", "libx264", "-preset", "medium", "-crf", "24", "-maxrate", "1100k", "-bufsize", "2200k"]
                  elif VIDEO_SIZE == "high":
                      venc = ["-c:v", "libx264", "-preset", "medium", "-crf", "19", "-maxrate", "2500k", "-bufsize", "5000k"]
                  else:
                      venc = ["-c:v", "libx264", "-preset", "medium", "-crf", "22", "-maxrate", "1500k", "-bufsize", "3000k"]

                  out_mp4 = work / "al_warraq_50s_hybrid.mp4"
                  enc_proc = subprocess.Popen(
                      ["ffmpeg", "-y", "-v", "error", "-f", "rawvideo", "-vcodec", "rawvideo", "-s", f"{W}x{H}", "-pix_fmt", "rgb24", "-r", str(FPS), "-i", "pipe:0", "-i", str(full_wav),
                       "-map", "0:v:0", "-map", "1:a:0", "-t", f"{tdur:.3f}", *venc, "-pix_fmt", "yuv420p", "-c:a", "aac", "-ac", "1", "-b:a", "96k", "-movflags", "+faststart", "-shortest", str(out_mp4)],
                      stdin=subprocess.PIPE, stderr=subprocess.PIPE,
                  )

                  # 3) المرحلة الأولى من الصورة: بث الفيديوهات الحقيقية الـ 30 ثانية الخاصة بك (بدون صوته -an)
                  if vw > vh and LAYOUT_MODE == "auto_vertical":
                      dec_fc = (
                          f"[0:v]yadif=0:-1:1,fps={FPS},split=2[fg][bg];"
                          f"[bg]scale=180:320:force_original_aspect_ratio=increase,crop=180:320,gblur=sigma=6,scale={W}:{H}:flags=bilinear,eq=brightness=-0.28[b];"
                          f"[fg]scale={W}:-2:force_original_aspect_ratio=decrease:flags=lanczos[f];"
                          f"[b][f]overlay=(W-w)/2:(H-h)/2:shortest=1,format=rgb24[v]"
                      )
                  else:
                      dec_fc = f"[0:v]yadif=0:-1:1,fps={FPS},scale={W}:{H}:force_original_aspect_ratio=increase:flags=lanczos,crop={W}:{H},format=rgb24[v]"

                  dec_proc = subprocess.Popen(
                      ["ffmpeg", "-v", "error", "-an", "-i", str(src_clip), "-filter_complex", dec_fc, "-map", "[v]", "-f", "rawvideo", "-pix_fmt", "rgb24", "pipe:1"],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  )

                  fbytes = W * H * 3
                  global_f, seg_idx = 0, 0
                  last_user_frame = None
                  max_user_frames = total_frames  # لا يتجاوز 50 ثانية بأي حال

                  while global_f < max_user_frames:
                      raw = dec_proc.stdout.read(fbytes)
                      if not raw or len(raw) < fbytes:
                          break
                      bg = np.frombuffer(raw, dtype=np.uint8).reshape((H, W, 3)).copy()
                      last_user_frame = bg

                      t = global_f / float(FPS)
                      while seg_idx + 1 < len(segs) and t >= segs[seg_idx]["t1"]:
                          seg_idx += 1
                      inv_a, fg_p = ov_layers[seg_idx]
                      comp = ((bg.astype(np.uint16) * inv_a + fg_p) // 255).astype(np.uint8)
                      if t < 0.40:
                          comp = (comp.astype(np.float32) * (t / 0.40)).astype(np.uint8)
                      elif t > tdur - 0.80:
                          comp = (comp.astype(np.float32) * max(0.0, (tdur - t) / 0.80)).astype(np.uint8)
                      enc_proc.stdin.write(comp.tobytes())
                      global_f += 1

                  dec_proc.stdout.close()
                  dec_err = dec_proc.stderr.read().decode("utf-8", errors="ignore")
                  dec_proc.wait()

                  decoded_sec = global_f / float(FPS)
                  print(f"🎬 تم فك تشفير فيديوك: {global_f} إطار ({decoded_sec:.2f}s من أصل {clip_dur:.2f}s)", flush=True)
                  if decoded_sec < clip_dur - 1.5 and global_f < max_user_frames:
                      print(f"⚠️ تنبيه: انقطع الفك مبكراً عند {decoded_sec:.1f}s — stderr: {dec_err[:300]}", flush=True)
                  if global_f == 0:
                      raise RuntimeError("❌ تعذر قراءة أي إطار من الفيديو المرفوع — تأكد أن الملف سليم على GitHub!")

                  # 4) المرحلة الثانية: تكملة الـ ~20 ثانية المتبقية بـ 3 لقطات مفحوصة بـ Gemini Vision
                  rem_frames = total_frames - global_f
                  if rem_frames > 0:
                      print(f"🔎 جاري إكمال {rem_frames / FPS:.1f}s المتبقية بـ 3 مشاهد مفحوصة بالرؤية...", flush=True)
                      used_urls = set()
                      comp_files = []
                      for i, sc in enumerate(COMPLEMENTARY_SHOTS):
                          print(f"   📌 مشهد تكميلي {i + 1}/3: {sc['name']}", flush=True)
                          cands = gather_candidates(sc, used_urls)
                          winner = pick_best_from_sheet(cands, sc["req"], i)
                          if winner:
                              used_urls.add(winner["url"])
                              comp_files.append(materialize_winner(winner, work, i))
                          else:
                              fb = work / f"fb_{i}.jpg"
                              Image.new("RGB", (W, H), (14, 12, 16)).save(fb, "JPEG")
                              comp_files.append(fb)

                      n_comp = len(comp_files)
                      xfade_frames = 10
                      base_len = rem_frames // n_comp
                      rem_mod = rem_frames % n_comp
                      counts = [base_len + (1 if k < rem_mod else 0) for k in range(n_comp)]
                      prev_tail = [last_user_frame] * min(xfade_frames, counts[0]) if last_user_frame is not None else []

                      for k, sf in enumerate(comp_files):
                          cnt = counts[k]
                          if cnt <= 0:
                              continue
                          extra = xfade_frames if k < n_comp - 1 else 0
                          frames_k = read_shot_frames(sf, cnt + extra)

                          for j in range(cnt):
                              bg = frames_k[j]
                              if j < len(prev_tail):
                                  w = j / float(len(prev_tail))
                                  bg = (prev_tail[j].astype(np.float32) * (1.0 - w) + bg.astype(np.float32) * w).astype(np.uint8)

                              t = global_f / float(FPS)
                              while seg_idx + 1 < len(segs) and t >= segs[seg_idx]["t1"]:
                                  seg_idx += 1
                              inv_a, fg_p = ov_layers[seg_idx]
                              comp = ((bg.astype(np.uint16) * inv_a + fg_p) // 255).astype(np.uint8)
                              if t > tdur - 0.80:
                                  comp = (comp.astype(np.float32) * max(0.0, (tdur - t) / 0.80)).astype(np.uint8)
                              enc_proc.stdin.write(comp.tobytes())
                              global_f += 1

                          prev_tail = frames_k[cnt:] if extra > 0 else []

                  enc_proc.stdin.close()
                  enc_err = enc_proc.stderr.read().decode("utf-8", errors="ignore")
                  if enc_proc.wait() != 0:
                      raise RuntimeError(f"خطأ الترميز:\n{enc_err[-800:]}")

                  mb, dur = out_mp4.stat().st_size / 1024 / 1024, get_dur(out_mp4)
                  print(f"🎬 جاهز: {mb:.2f} MB | المدة: {dur:.1f}s (30ث حقيقي + تكملة الكود)", flush=True)

                  cap = (
                      f"{preset['caption']}\n\n"
                      "🤲 اللهم ارحم ضحايا فاجعة الوراق وتقبّلهم في الشهداء، واشفِ المصابين، وأنزل السلوان على ذويهم.\n"
                      "خالص العزاء والمواساة من أهل الموصل بالعراق إلى أهلنا في مصر الحبيبة 🇮🇶 🇪🇬\n"
                      "لاحول ولاقوة الا بالله 🌖\n"
                      f"📦 {mb:.1f} MB | {dur:.0f} ثانية"
                  )
                  with open(out_mp4, "rb") as vf:
                      res = requests.post(
                          f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendVideo",
                          data={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "caption": cap, "supports_streaming": "true", "width": str(W), "height": str(H)},
                          files={"video": (out_mp4.name, vf, "video/mp4")},
                          timeout=180,
                      ).json()
                  assert res.get("ok"), f"Telegram Error: {res}"
                  print("✅ تم إرسال الريلز إلى تيليغرام بنجاح!", flush=True)
              finally:
                  shutil.rmtree(work, ignore_errors=True)

          if __name__ == "__main__":
              main()
          PYEOF
