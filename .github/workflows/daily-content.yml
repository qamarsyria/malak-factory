name: 📅 اليوميات (Daily Content)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'نوع المقطع (للتجربة اليدوية)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - fiqh
          - hadith
          - quran
          - adhkar
          - dua

env:
  # غيّرها إلى "true" بعد الاطمئنان للنتائج على تيليجرام لتفعيل النشر التلقائي
  AUTO_PUBLISH: "false"

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-hosny-amiri espeak-ng libespeak-ng1 \
            libraqm-dev libfribidi-dev libharfbuzz-dev
          pip install --upgrade pip
          pip install "numpy<2" requests edge-tts pillow arabic-reshaper python-bidi \
            huggingface_hub quranic-phonemizer datasets \
            opencv-python-headless onnxruntime "gradio_client>=1.10.0,<2.0.0"
          pip install --force-reinstall phonemizer==3.2.1

      - name: Fetch All Libraries (Fiqh, Hadith, Quran, Adhkar)
        run: |
          python -u scripts/fetch_fiqh_library.py
          python -u scripts/fetch_hadith_library.py
          python -u scripts/fetch_ayah_library.py
          python -u scripts/fetch_adhkar_library.py

      - name: Generate Daily Content
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          FORCE_CONTENT_TYPE: ${{ github.event.inputs.content_type || 'auto' }}
        run: |
          python -u scripts/generate_daily.py
          if [ -f out/latest_episode.txt ]; then
            EP_FILE=$(cat out/latest_episode.txt)
            echo "EP_FILE=$EP_FILE" >> $GITHUB_OUTPUT
            echo "EP_NAME=$(basename "$EP_FILE" .json)" >> $GITHUB_OUTPUT
          else
            echo "❌ فشل توليد المقطع اليومي"
            exit 1
          fi

      - name: Build Audio (Both)
        id: aud
        if: steps.gen.outputs.EP_FILE != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TTS_ENGINE: "1"
          ENABLE_EN_SUBTITLES: "1"
        run: |
          python -u scripts/story_audio.py \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "out/${{ steps.gen.outputs.EP_NAME }}_yt.mp3" \
            "out/${{ steps.gen.outputs.EP_NAME }}_social.mp3" \
            --mode both

      - name: Build Video (YouTube)
        id: vid_yt
        if: steps.aud.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHARE_EPISODE_MEDIA: "1"
          CINEMA_ANIME_MODE: "0"
          USE_ISLAMIC_CARDS: "1"
          ENABLE_8D_RAYS: "0"
          ENABLE_8D_PARTICLES: "0"
        run: |
          mkdir -p videos
          rm -rf /tmp/story_media_cache
          python -u scripts/story_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}_yt_meta.json" \
            "out/${{ steps.gen.outputs.EP_NAME }}_yt.mp3" \
            "videos/${{ steps.gen.outputs.EP_NAME }}_yt.mp4" \
            "yt"

      - name: Build Video (Social)
        id: vid_soc
        if: steps.aud.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHARE_EPISODE_MEDIA: "1"
          CINEMA_ANIME_MODE: "0"
          USE_ISLAMIC_CARDS: "1"
          ENABLE_8D_RAYS: "0"
          ENABLE_8D_PARTICLES: "0"
        run: |
          mkdir -p videos
          python -u scripts/story_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}_social_meta.json" \
            "out/${{ steps.gen.outputs.EP_NAME }}_social.mp3" \
            "videos/${{ steps.gen.outputs.EP_NAME }}_social.mp4" \
            "social"
          rm -rf /tmp/story_media_cache

      - name: Upload to Telegram
        id: tg
        if: steps.vid_yt.outcome == 'success' && steps.vid_soc.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          META="out/${{ steps.gen.outputs.EP_NAME }}_yt_meta.json"
          TITLE=$(python -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8')).get('title', 'مقطع يومي'))" "$META")

          upload_tg() {
            local VIDEO_PATH="$1"
            local OUT_TAG="$2"
            local LABEL="$3"
            local UPLOAD_FILE="$VIDEO_PATH"

            local SIZE
            SIZE=$(stat -c%s "$VIDEO_PATH")
            echo "📹 $VIDEO_PATH ($(awk "BEGIN {printf \"%.1f\", $SIZE/1048576}") MB)"
            if [ $((SIZE / 1024 / 1024)) -gt 45 ]; then
              local COMPRESSED="videos/${{ steps.gen.outputs.EP_NAME }}_${OUT_TAG}_tg.mp4"
              ffmpeg -y -i "$VIDEO_PATH" -vf "scale=720:-2" -c:v libx264 -crf 28 -maxrate 165k -bufsize 330k -preset medium -c:a aac -ac 1 -b:a 36k -movflags +faststart "$COMPRESSED"
              UPLOAD_FILE="$COMPRESSED"
            fi

            local CAPTION
            CAPTION=$(printf "🎬 [%s]\n%s\n\n#إسلاميات #ملاك_المعرفة" "$LABEL" "$TITLE")

            local RESP
            RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "video=@${UPLOAD_FILE}" \
              -F "caption=${CAPTION}" \
              -F "supports_streaming=true")

            python -c "import json, sys; d=json.loads(sys.argv[1]); assert d.get('ok'), f'Telegram Error: {d}'; print('✅ تم الرفع:', d['result']['message_id'])" "$RESP"
          }

          upload_tg "videos/${{ steps.gen.outputs.EP_NAME }}_yt.mp4" "yt" "نسخة اليوتيوب (تلاوة Gemini + صدى المسجد)"
          upload_tg "videos/${{ steps.gen.outputs.EP_NAME }}_social.mp4" "social" "نسخة فيسبوك/تيك توك"

      - name: Publish to YouTube
        if: steps.vid_yt.outcome == 'success' && env.AUTO_PUBLISH == 'true'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -f scripts/publish_youtube.py ]; then
            python -u scripts/publish_youtube.py \
              "videos/${{ steps.gen.outputs.EP_NAME }}_yt.mp4" \
              "out/${{ steps.gen.outputs.EP_NAME }}_yt_meta.json"
          fi

      - name: Publish to Facebook & TikTok (Zernio)
        if: steps.vid_soc.outcome == 'success' && env.AUTO_PUBLISH == 'true'
        continue-on-error: true
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: |
          if [ -f scripts/publish_zernio.py ]; then
            python -u scripts/publish_zernio.py \
              "videos/${{ steps.gen.outputs.EP_NAME }}_social.mp4" \
              "out/${{ steps.gen.outputs.EP_NAME }}_social_meta.json"
          fi

      - name: Cleanup and Save State
        if: steps.tg.outcome == 'success'
        run: |
          rm -rf videos out data/daily/generated data/libraries

          git config --global http.version HTTP/1.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/daily_state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update daily state [skip ci]"
            for attempt in 1 2 3; do
              echo "🔄 محاولة رفع الحالة ($attempt/3)..."
              git pull --rebase --autostash || true
              if git push || git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"; then
                echo "✅ تم حفظ الحالة بنجاح"
                exit 0
              fi
              sleep $((attempt * 10))
            done
            echo "❌ فشل git push بعد 3 محاولات"
            exit 1
          fi
