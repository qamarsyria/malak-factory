name: Test Voxtral TTS (Arabic)

# ═════════════════════════════════════════════════════════════
# اختبار Voxtral-4B-TTS-2603 على آية قرآنية واحدة
# الاستخدام: Actions → Test Voxtral TTS (Arabic) → Run workflow
# المخرجات: artifact اسمه "voxtral-test" — حمّله واسمع fatiha_1.wav
# ═════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

jobs:
  test-voxtral:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip curl libgomp1

      - name: Run Voxtral test
        run: |
          bash test_voxtral.sh 2>&1 | tee voxtral_log.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxtral-test
          path: |
            out/test_voxtral/fatiha_1.wav
            out/test_voxtral/voxtral_log.txt
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## 🎧 Voxtral Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f out/test_voxtral/fatiha_1.wav ]; then
            SIZE=$(stat -c%s out/test_voxtral/fatiha_1.wav)
            echo "✅ **نجح** — الحجم: ${SIZE} bytes" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **فشل** — راجع السجل" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "حمّل الـ artifact من قسم Artifacts أدناه." >> $GITHUB_STEP_SUMMARY
