name: Test YouTube AI Agent with VPN

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'عنوان الفيديو'
        default: 'اختبار AI Agent — مالك فاكتوري'
      description:
        description: 'الوصف'
        default: 'رفع تجريبي عبر Gemini Vision.'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps & WireGuard
        run: |
          pip install requests playwright aiohttp pyotp beautifulsoup4
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg wireguard-tools resolvconf

      - name: Setup VPN (Mullvad)
        run: |
          echo "${{ secrets.WIREGUARD_CONFIG }}" > wg0.conf
          sudo cp wg0.conf /etc/wireguard/wg0.conf
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          echo "✅ VPN Connected. Real IP:"
          curl -s https://am.i.mullvad.net/connected

      - name: Generate test video
        run: |
          mkdir -p out
          ffmpeg -y -f lavfi -i color=c=black:s=1280x720:d=8 \
            -f lavfi -i sine=frequency=440:duration=8 \
            -vf "drawtext=text='AI Agent Test':fontcolor=white:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 -c:a aac -shortest out/video.mp4

      - name: Run AI Agent
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GOOGLE_TOTP_SECRET: ${{ secrets.GOOGLE_TOTP_SECRET }}
          YT_TITLE: ${{ github.event.inputs.title }}
          YT_DESC: ${{ github.event.inputs.description }}
        run: python scripts/youtube_ai_agent.py

      - name: Shutdown VPN
        if: always()
        run: sudo wg-quick down wg0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-traces
          path: |
            out/screenshots/
            out/flight_recorder.json
