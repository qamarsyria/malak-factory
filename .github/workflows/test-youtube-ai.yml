name: Test YouTube AI Agent with VPN

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'عنوان الفيديو'
        default: 'اختبار AI Agent — مالك فاكتوري'
      description:
        description: 'الوصف'
        default: 'رفع تجريبي عبر Gemini Vision.'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps & WireGuard
        run: |
          pip install requests playwright aiohttp pyotp beautifulsoup4
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg wireguard-tools

      - name: Setup VPN (Raw WireGuard, No wg-quick)
        run: |
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          
          # 1. إيقاف خدمة DNS المتعارضة
          sudo systemctl stop systemd-resolved || true
          sudo systemctl disable systemd-resolved || true
          
          # 2. إنشاء النفق يدوياً (بدون wg-quick)
          sudo ip link add dev wg0 type wireguard
          sudo wg setconf wg0 /etc/wireguard/wg0.conf
          
          # استخراج الـ IP من الإعدادات وإضافته
          ADDR=$(grep "^Address" /etc/wireguard/wg0.conf | cut -d'=' -f2 | tr -d ' ' | cut -d',' -f1)
          sudo ip -4 address add "$ADDR" dev wg0
          sudo ip link set mtu 1420 up dev wg0
          
          # 3. توجيه كل الترافيك عبر النفق
          sudo ip -4 route add 0.0.0.0/0 dev wg0 table 51820
          sudo ip -4 rule add not fwmark 51820 table 51820
          sudo ip -4 rule add table main suppress_prefixlength 0
          sudo sysctl -q net.ipv4.conf.all.src_valid_mark=1
          
          # 4. إعداد الـ DNS يدوياً (Cloudflare + Google - متاحان عالمياً)
          sudo rm -f /etc/resolv.conf
          sudo sh -c 'echo "nameserver 1.1.1.1" > /etc/resolv.conf'
          sudo sh -c 'echo "nameserver 8.8.8.8" >> /etc/resolv.conf'
          
          echo "✅ VPN Connected."
          echo "🔍 Testing DNS resolution:"
          nslookup m.youtube.com || echo "⚠️ DNS still failing..."
          echo "🔍 Testing external IP (should show Netherlands):"
          curl -s --max-time 15 https://ipinfo.io/ip || echo "⚠️ curl failed..."

      - name: Generate test video
        run: |
          mkdir -p out
          ffmpeg -y -f lavfi -i color=c=black:s=1280x720:d=8 \
            -f lavfi -i sine=frequency=440:duration=8 \
            -vf "drawtext=text='AI Agent Test':fontcolor=white:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 -c:a aac -shortest out/video.mp4

      - name: Run AI Agent
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GOOGLE_TOTP_SECRET: ${{ secrets.GOOGLE_TOTP_SECRET }}
          YT_TITLE: ${{ github.event.inputs.title }}
          YT_DESC: ${{ github.event.inputs.description }}
        run: python scripts/youtube_ai_agent.py

      - name: Shutdown VPN & Restore DNS
        if: always()
        run: |
          # 1. حذف النفق
          sudo ip link delete dev wg0 || true
          sudo ip -4 rule delete table 51820 || true
          sudo ip -4 rule delete table main suppress_prefixlength 0 || true
          
          # 2. إعادة DNS إلى الوضع الافتراضي (لكي يعمل رفع الـ Artifact)
          sudo rm -f /etc/resolv.conf
          sudo sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'
          sudo sh -c 'echo "nameserver 1.1.1.1" >> /etc/resolv.conf'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-traces
          path: |
            out/screenshots/
            out/flight_recorder.json
