name: Test YouTube AI Agent with VPN

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'عنوان الفيديو'
        default: 'اختبار AI Agent — مالك فاكتوري'
      description:
        description: 'الوصف'
        default: 'رفع تجريبي عبر Gemini Vision.'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps & WireGuard
        run: |
          pip install requests playwright aiohttp pyotp beautifulsoup4
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg wireguard-tools resolvconf

      - name: Setup VPN (Mullvad) & Fix DNS
        run: |
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          
          # 1. حذف سطر DNS من ملف الـ VPN (لكي لا يتدخل في إعداداتنا)
          sudo sed -i '/^DNS =/d' /etc/wireguard/wg0.conf
          
          # 2. إيقاف خدمة الـ DNS المتعارضة في GitHub
          sudo systemctl stop systemd-resolved || true
          sudo systemctl disable systemd-resolved || true
          
          # 3. إعداد الـ DNS يدوياً (Mullvad + Google + Cloudflare)
          sudo rm -f /etc/resolv.conf
          echo "nameserver 10.64.0.1" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf
          
          # 4. تشغيل الـ VPN الآن (بدون مشاكل DNS)
          sudo wg-quick up wg0
          
          echo "✅ VPN Connected."
          echo "🔍 Testing DNS resolution:"
          nslookup m.youtube.com || echo "⚠️ DNS still failing..."
          echo "🔍 Testing external IP (should show Netherlands):"
          curl -s --max-time 15 https://ipinfo.io/ip || echo "⚠️ curl failed..."

      - name: Generate test video
        run: |
          mkdir -p out
          ffmpeg -y -f lavfi -i color=c=black:s=1280x720:d=8 \
            -f lavfi -i sine=frequency=440:duration=8 \
            -vf "drawtext=text='AI Agent Test':fontcolor=white:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 -c:a aac -shortest out/video.mp4

      - name: Run AI Agent
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GOOGLE_TOTP_SECRET: ${{ secrets.GOOGLE_TOTP_SECRET }}
          YT_TITLE: ${{ github.event.inputs.title }}
          YT_DESC: ${{ github.event.inputs.description }}
        run: python scripts/youtube_ai_agent.py

      - name: Shutdown VPN
        if: always()
        run: sudo wg-quick down wg0 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-traces
          path: |
            out/screenshots/
            out/flight_recorder.json
