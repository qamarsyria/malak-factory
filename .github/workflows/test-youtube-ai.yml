name: Test YouTube AI Agent with Auto-Proxy

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests playwright aiohttp pyotp beautifulsoup4
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Generate test video
        run: |
          mkdir -p out
          ffmpeg -y -f lavfi -i color=c=black:s=1280x720:d=8 -f lavfi -i sine=frequency=440:duration=8 -vf "drawtext=text='AI Agent Test':fontcolor=white:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2" -c:v libx264 -c:a aac -shortest out/video.mp4

      - name: Run AI Agent
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GOOGLE_TOTP_SECRET: ${{ secrets.GOOGLE_TOTP_SECRET }}
          YT_TITLE: "اختبار AI Agent مع بروكسي تلقائي"
          YT_DESC: "رفع تجريبي عبر Gemini Vision ونظام بروكسي ذكي."
        run: python scripts/youtube_ai_agent.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-traces
          path: |
            out/screenshots/
            out/flight_recorder.json
