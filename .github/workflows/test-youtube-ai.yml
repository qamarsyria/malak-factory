name: Test YouTube AI Agent with VPN

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'عنوان الفيديو'
        default: 'اختبار AI Agent — مالك فاكتوري'
      description:
        description: 'الوصف'
        default: 'رفع تجريبي عبر Gemini Vision.'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps & WireGuard
        run: |
          pip install requests playwright aiohttp pyotp beautifulsoup4
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg wireguard-tools

      - name: Setup VPN (Mullvad) - FINAL VERSION
        run: |
          set -x
          
          # 1. تجهيز الإعدادات (حذف سطر DNS نهائياً)
          sudo mkdir -p /etc/wireguard
          echo "${{ secrets.WIREGUARD_CONFIG }}" | grep -v '^DNS' | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          
          echo "=== Config after DNS removal ==="
          sudo sed 's/PrivateKey = .*/PrivateKey = [REDACTED]/' /etc/wireguard/wg0.conf
          echo "================================="
          
          # 2. تعطيل نظام DNS المتعارض
          sudo systemctl stop systemd-resolved || true
          sudo systemctl disable systemd-resolved || true
          
          # 3. جعل /etc/resolv.conf ملفاً عادياً (ليس symlink)
          sudo rm -f /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
          
          # 4. تشغيل النفق (لن يلمس DNS لأننا حذفناه)
          sudo wg-quick up wg0
          
          # 5. الآن نضع DNS الخاص بـ Mullvad يدوياً
          sudo sh -c 'echo "nameserver 10.64.0.1" > /etc/resolv.conf'
          sudo sh -c 'echo "nameserver 1.1.1.1" >> /etc/resolv.conf'
          
          # 6. الاختبارات
          echo ""
          echo "=== Tunnel Status ==="
          sudo wg show
          echo ""
          echo "=== Routes ==="
          ip route | head -10
          echo ""
          echo "=== Ping Mullvad DNS (10.64.0.1) ==="
          ping -c 2 -W 3 10.64.0.1 || echo "❌ Ping failed"
          echo ""
          echo "=== External IP (should be Netherlands) ==="
          curl -s --max-time 15 https://ipinfo.io/ip || echo "❌ curl failed"
          echo ""
          echo "=== DNS Resolution Test ==="
          nslookup m.youtube.com || echo "❌ DNS failed"

      - name: Generate test video
        run: |
          mkdir -p out
          ffmpeg -y -f lavfi -i color=c=black:s=1280x720:d=8 \
            -f lavfi -i sine=frequency=440:duration=8 \
            -vf "drawtext=text='AI Agent Test':fontcolor=white:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 -c:a aac -shortest out/video.mp4

      - name: Run AI Agent
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          GOOGLE_TOTP_SECRET: ${{ secrets.GOOGLE_TOTP_SECRET }}
          YT_TITLE: ${{ github.event.inputs.title }}
          YT_DESC: ${{ github.event.inputs.description }}
        run: python scripts/youtube_ai_agent.py

      - name: Shutdown VPN
        if: always()
        run: |
          sudo wg-quick down wg0 || true
          # استعادة DNS الافتراضي لـ GitHub Actions
          sudo rm -f /etc/resolv.conf
          sudo sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-traces
          path: |
            out/screenshots/
            out/flight_recorder.json
