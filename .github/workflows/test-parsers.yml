name: Test Parsers

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run parse_riyad.js
        run: node scripts/parse_riyad.js

      - name: Run parse_content.js
        run: node scripts/parse_content.js

      - name: Show results
        run: |
          echo "===== riyad-salihin.json ====="
          if [ -f data/riyad-salihin.json ]; then
            echo "عدد الأحاديث: $(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/riyad-salihin.json")).length)')"
            echo "أول 3 عناصر:"
            node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync("data/riyad-salihin.json")).slice(0,3), null, 2))'
          else
            echo "❌ الملف غير موجود"
          fi
          echo ""
          echo "===== faq-data.json ====="
          if [ -f data/faq-data.json ]; then
            echo "عدد المسائل: $(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/faq-data.json")).length)')"
            node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync("data/faq-data.json")).slice(0,2), null, 2))'
          else
            echo "❌ الملف غير موجود"
          fi
          echo ""
          echo "===== hadith-db.json ====="
          if [ -f data/hadith-db.json ]; then
            echo "عدد الأحاديث: $(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/hadith-db.json")).length)')"
            node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync("data/hadith-db.json")).slice(0,2), null, 2))'
          else
            echo "❌ الملف غير موجود"
          fi
