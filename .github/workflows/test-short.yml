name: Test Short Episode

on:
  workflow_dispatch:

jobs:
  test-short:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 curl fonts-hosny-amiri

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchaudio==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          pip freeze | grep -E '^(torch|torchaudio|torchvision)==' > /tmp/c.txt
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --constraint /tmp/c.txt
          pip install huggingface_hub soundfile numpy scipy librosa edge-tts pillow requests --constraint /tmp/c.txt
          pip install neucodec --no-deps --constraint /tmp/c.txt
          pip install local_attention vector-quantize-pytorch transformers --constraint /tmp/c.txt

      - name: Run Test Short
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python test_short.py

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-short-video
          path: out/test_short/
          retention-days: 7
