name: Test Audio Mixer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install requests gTTS edge-tts

      - name: Build 3 variants
        run: python scripts/audio_mixer.py

      - name: Show results
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          ls -lh out/ || echo "لا يوجد"
          echo ""
          for f in out/episode-audio-*.mp3; do
            if [ -f "$f" ]; then
              echo "$f:"
              ffprobe -v error -show_entries format=duration -of \
                default=noprint_wrappers=1:nokey=1 "$f"
              echo ""
            fi
          done

      - name: Upload all variants
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-audio-variants
          path: out/
          retention-days: 7
          if-no-files-found: warn
