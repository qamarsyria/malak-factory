name: Test Audio Mixer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install requests gTTS

      - name: Build audio
        run: python scripts/audio_mixer.py

      - name: Show result
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          ls -lh out/ || echo "لا يوجد"
          echo ""
          if [ -f "out/episode-audio.mp3" ]; then
            echo "المدة:"
            ffprobe -v error -show_entries format=duration -of \
              default=noprint_wrappers=1:nokey=1 out/episode-audio.mp3
          fi

      - name: Upload audio as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-audio
          path: out/
          retention-days: 7
          if-no-files-found: warn
