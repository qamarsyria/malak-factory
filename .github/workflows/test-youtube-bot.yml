name: Test YouTube Bot

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'عنوان الفيديو'
        default: 'اختبار رفع آلي — مالك فاكتوري'
      description:
        description: 'الوصف'
        default: 'رفع تجريبي من مصنع مالك.'

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate test video
        run: |
          mkdir -p out
          ffmpeg -y -f lavfi -i color=c=black:s=1280x720:d=8 \
            -f lavfi -i sine=frequency=440:duration=8 \
            -vf "drawtext=text='Malak Factory Test':fontcolor=white:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 -c:a aac -shortest out/video.mp4
          ls -la out/

      - name: Upload to YouTube
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YT_TITLE: ${{ github.event.inputs.title }}
          YT_DESC: ${{ github.event.inputs.description }}
        run: python scripts/youtube_upload_playwright.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-bot-screenshots
          path: out/screenshots/
          if-no-files-found: ignore
