name: 🎬 بناء حلقة قصص

on:
  schedule:
    - cron: '0 0 * * *'   # يومياً منتصف الليل UTC
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      needs_review: ${{ steps.check.outputs.needs_review }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check review requirement
        id: check
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, 'scripts')
          from story_library import load_global, needs_manual_review
          gstate = load_global()
          era = gstate.get("current_era", "")
          needs = needs_manual_review(era)
          output_file = os.environ.get("GITHUB_OUTPUT", "/tmp/out")
          with open(output_file, "a") as f:
              f.write(f"needs_review={'true' if needs else 'false'}\n")
          print(f"era={era} needs_review={needs}")
          EOF

  review-gate:
    needs: prepare
    if: needs.prepare.outputs.needs_review == 'true'
    runs-on: ubuntu-latest
    environment: story-review
    steps:
      - run: echo "✅ تمت الموافقة على المراجعة"

  produce:
    needs: [prepare, review-gate]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.review-gate.result == 'success' || needs.review-gate.result == 'skipped')
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          # أضفنا espeak-ng لـ phonemizer وحزم lxml لـ BeautifulSoup
          sudo apt-get install -y ffmpeg git wget fonts-hosny-amiri espeak-ng libespeak-ng-dev libxml2-dev libxslt1-dev

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # تثبيت مكتبات الصوت والفيديو المتقدمة
          pip install --force-reinstall phonemizer==3.2.1
          pip install -q "pip<24.1" "setuptools<81"
          pip install -q torch==2.5.0 torchvision==0.20.0 torchaudio==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==1.26.4 scipy librosa==0.10.2 soundfile transformers==4.39.3 onnxruntime av praat-parselmouth faiss-cpu==1.7.3 pyworld torchcrepe huggingface_hub requests matplotlib omegaconf ffmpeg-python
          pip install -q fairseq==0.12.2 || echo "⚠️ fairseq skipped (optional)"

      - name: Verify story is prepared
        id: verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STORY_ID=$(python -c "import sys; sys.path.insert(0, 'scripts'); from story_library import load_global; print(load_global()['current_story_id'])")
          AUDITED="data/stories/${STORY_ID}/audited/events"
          if [ ! -d "$AUDITED" ] || [ -z "$(ls -A $AUDITED 2>/dev/null)" ]; then
            echo "❌ القصة '$STORY_ID' لم تُجهّز بعد! (تأكد من تشغيل collect_story.py و audit_story.py أولاً)"
            exit 1
          fi
          echo "✅ القصة '$STORY_ID' مجهزة"

      - name: Generate script
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scripts/generate_story.py
          if [ -f out/latest_episode.txt ]; then
            EP_FILE=$(cat out/latest_episode.txt)
            EP_NAME=$(basename "$EP_FILE" .json)
            echo "ep_file=$EP_FILE" >> $GITHUB_OUTPUT
            echo "ep_name=$EP_NAME" >> $GITHUB_OUTPUT
            echo "has_episode=true" >> $GITHUB_OUTPUT
            echo "✅ $EP_NAME"
          else
            echo "has_episode=false" >> $GITHUB_OUTPUT
          fi

      # بناء الصوت
      - name: Build audio
        if: steps.gen.outputs.has_episode == 'true'
        id: audio
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TTS_ENGINE: '1'
        run: |
          mkdir -p out
          python scripts/story_audio.py \
            "${{ steps.gen.outputs.ep_file }}" \
            "out/social_${{ steps.gen.outputs.ep_name }}.mp3" \
            "out/social_${{ steps.gen.outputs.ep_name }}.mp3"

      # بناء الفيديو الطولي (تم إصلاح الترتيب هنا)
      - name: Build vertical video
        if: steps.audio.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          # الترتيب الصح: ميتا، صوت، فيديو ناتج، وضع (سوشيال)
          python scripts/story_video.py \
            "out/social_${{ steps.gen.outputs.ep_name }}_meta.json" \
            "out/social_${{ steps.gen.outputs.ep_name }}.mp3" \
            "videos/social_${{ steps.gen.outputs.ep_name }}.mp4" \
            social
          ls -lh videos/

      # الرفع (مع ضغط قوي وفحص استجابة تلغرام)
      - name: Compress & Upload to Telegram
        id: telegram
        if: steps.gen.outputs.has_episode == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          UPLOADED=0
          FAILED=0

          for f in videos/*.mp4; do
            [ -f "$f" ] || continue

            echo "📹 الأصلي: $(du -h "$f" | cut -f1) — $f"
            COMPRESSED="compressed_$(basename $f)"

            # حساب مدة الفيديو
            DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f")
            
            # حساب البتريت المستهدف (استهداف 42 ميجا كحد أقصى)
            TARGET_KBPS=$(awk "BEGIN {printf \"%d\", ((42 * 8 * 1024 * 1024) / $DURATION / 1000) - 64}")
            
            # تثبيت الحدود
            [ "$TARGET_KBPS" -gt 800 ] && TARGET_KBPS=800
            [ "$TARGET_KBPS" -lt 300 ] && TARGET_KBPS=300

            echo "⏱️ ${DURATION}s | ${TARGET_KBPS}kbps | 720p"

            # إصلاح الفلتر: ضمان أبعاد زوجية (حتى لا يفشل H.264) وضغط آمن
            ffmpeg -y -i "$f" \
              -vf "scale='min(720,iw)':'min(1280,ih)':force_original_aspect_ratio=decrease,pad=ceil(iw/2)*2:ceil(ih/2)*2" \
              -c:v libx264 -b:v "${TARGET_KBPS}k" -maxrate "${TARGET_KBPS}k" -bufsize "$((TARGET_KBPS * 2))k" \
              -preset medium \
              -c:a aac -b:a 64k \
              -movflags +faststart \
              "$COMPRESSED"

            FINAL_SIZE_MB=$(du -m "$COMPRESSED" | cut -f1)
            echo "✅ بعد الضغط: ${FINAL_SIZE_MB} MB"

            if [ "$FINAL_SIZE_MB" -gt 48 ]; then
              echo "❌ تجاوز 48 MB — سيتم تخطي الرفع"
              FAILED=$((FAILED+1))
              rm "$COMPRESSED"
              continue
            fi

            # إصلاح: فحص استجابة تلغرام بدلاً من الاكتفاء بنجاح curl
            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "video=@${COMPRESSED}" \
                -F "caption=🎬 $(basename $f)")

            if echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "✅ رُفع بنجاح"
              UPLOADED=$((UPLOADED+1))
            else
              echo "❌ فشل الرفع (تلغرام): $RESPONSE"
              FAILED=$((FAILED+1))
            fi
            rm "$COMPRESSED"
          done

          echo "📊 رُفع: $UPLOADED | فشل: $FAILED"
          if [ "$UPLOADED" -eq 0 ]; then
            echo "❌ لم يُرفع أي فيديو — إيقاف"
            exit 1
          fi

      - name: Finalize episode
        if: steps.gen.outputs.has_episode == 'true' && steps.telegram.outcome == 'success'
        run: |
          python scripts/finalize_episode.py "${{ steps.gen.outputs.ep_file }}"

      - name: Cleanup
        if: steps.gen.outputs.has_episode == 'true' && steps.telegram.outcome == 'success'
        run: |
          python scripts/cleanup_old_files.py --episode "${{ steps.gen.outputs.ep_name }}"

      - name: Commit state
        if: steps.gen.outputs.has_episode == 'true' && steps.telegram.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ data/stories/*/state.json || true
          git commit -m "🎬 ${{ steps.gen.outputs.ep_name }}" || echo "لا تغييرات"
          git push || true

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 فشل بناء حلقة: ${{ steps.gen.outputs.ep_name || 'unknown' }}"
