name: Build Story Episode

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'اسم القصة (yusuf)'
        default: 'yusuf'
      episode:
        description: 'رقم الحلقة (1-21) أو اتركه فارغاً لكل الحلقات'
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: pip install requests

      - name: Build episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_SLUG: ${{ inputs.slug }}
          EPISODE_NUMBER: ${{ inputs.episode }}
        run: python scripts/gemini_story.py

      - name: Show result
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          ls -lh data/stories/yusuf/ || echo "لا يوجد"
          echo ""
          if [ -f "data/stories/yusuf/episode-${{ inputs.episode }}.json" ]; then
            echo "أول 50 سطر من الحلقة:"
            head -50 "data/stories/yusuf/episode-${{ inputs.episode }}.json"
          fi

      - name: Upload episode as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-episode-${{ inputs.episode }}
          path: data/stories/
          retention-days: 7

      - name: Commit episode
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stories/
          if ! git diff --cached --quiet; then
            git commit -m "chore: build story episode ${{ inputs.episode }} for ${{ inputs.slug }}"
            git push
          fi
