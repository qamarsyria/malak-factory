name: Test Voice

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Run voice tests
        run: python scripts/test_voice.py

      - name: Show durations
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          for f in out/test-*.mp3; do
            if [ -f "$f" ]; then
              echo "$(basename $f): $(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f")"
            fi
          done

      - name: Upload all variants
        uses: actions/upload-artifact@v4
        with:
          name: voice-tests
          path: out/test-*.mp3
          retention-days: 7
