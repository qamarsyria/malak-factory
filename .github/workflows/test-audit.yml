name: 🧪 اختبار التدقيق فقط

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install requests==2.32.3

      - name: Run Audit (Force)
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # بنشغل التدقيق مع --force عشان نكتب فوق النسخة القديمة
          python scripts/audit_story.py creation-pen --force

      - name: Commit Audited Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stories/creation-pen/audited/
          git commit -m "🔍 تدقيق جديد: creation-pen" || echo "لا تغييرات"
          git push || true
