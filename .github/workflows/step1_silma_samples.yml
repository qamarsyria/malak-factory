name: Step1 SILMA Samples

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 360   # رُفع من 90 إلى 360 دقيقة

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python Dependencies
        run: |
          pip install requests
          pip install silma-tts

      - name: Generate SILMA Samples
        run: |
          python scripts/step1_silma_samples.py

      - name: Upload Samples as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: silma-voice-samples
          path: rvc_training/silma_samples/*.wav
          retention-days: 30
