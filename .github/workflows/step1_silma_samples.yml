name: Step1 SILMA Samples

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 1) PyTorch CPU أولاً (النسخة المرجعية)
      - name: Install PyTorch CPU (First Pass)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade torch torchvision torchaudio torchcodec \
            --index-url https://download.pytorch.org/whl/cpu

      # 2) silma-tts وتبعياتها
      - name: Install silma-tts
        run: |
          pip install requests
          pip install silma-tts

      # 3) فرض إعادة تثبيت حزم PyTorch من فهرس CPU (بدون لمس تبعيات silma-tts)
      #    --no-deps = ما نعيد حل الشجرة، بس نستبدل الحزم
      - name: Force PyTorch CPU Re-install (Final Guard)
        run: |
          pip install --force-reinstall --no-deps \
            torch torchvision torchaudio torchcodec \
            --index-url https://download.pytorch.org/whl/cpu
          echo "===== التحقق من النسخ النهائية ====="
          python -c "
          import torch, torchvision, torchaudio
          print('torch      =', torch.__version__)
          print('torchvision=', torchvision.__version__)
          print('torchaudio =', torchaudio.__version__)
          "
          echo "===== التحقق من torchcodec ====="
          python -c "import torchcodec; print('torchcodec OK')" || echo "⚠️ torchcodec لسه فيه مشكلة، بس منكمل (السكربت ممكن يشتغل بدونه)."

      # 4) تشغيل السكربت
      - name: Generate SILMA Samples
        run: |
          python scripts/step1_silma_samples.py

      # 5) رفع العينات
      - name: Upload Samples as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: silma-voice-samples
          path: rvc_training/silma_samples/*.wav
          retention-days: 30
          if-no-files-found: warn
