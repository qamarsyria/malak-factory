name: Malak Voice Factory
on:
  workflow_dispatch: # هذا الخيار بيخلينا نشغل المصنع يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          # 1. تثبيت pip 24.0 لحل مشكلة fairseq
          python -m pip install --upgrade pip==24.0
          # 2. تثبيت omegaconf 2.0.5 أولاً لتجنب تعارض الاعتماديات
          pip install omegaconf==2.0.5
          
          # 3. تثبيت باقي المكتبات (بما فيها fairseq)
          pip install torch==2.5.0 torchvision==0.20.0 torchaudio==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 scipy librosa==0.10.2 soundfile ffmpeg-python fairseq==0.12.2 faiss-cpu praat-parselmouth
          
      - name: Download RVC Engine
        run: |
          wget https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI/archive/refs/heads/main.zip
          unzip main.zip
          mv Retrieval-based-Voice-Conversion-WebUI-main Retrieval-based-Voice-Conversion-WebUI

      - name: Download Malak Models
        run: |
          wget -O malak_voice.pth https://github.com/qamarsyi/malak-factory/releases/download/v1.0/malak_voice.pth
          wget -O added_malak_voice.index https://github.com/qamarsyi/malak-factory/releases/download/v1.0/added_malak_voice.index

      - name: Download Input Audio (Test)
        run: |
          # هنا بننزل صوت تجريبي للتأكد إن المعمل شغال (بصوت جيميني)
          wget -O input.mp3 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI/raw/main/docs/assets/sample.mp3

      - name: Run Conversion
        run: python malak_converter.py

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: converted-audio
          path: malak_output.wav
