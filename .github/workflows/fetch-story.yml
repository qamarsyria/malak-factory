name: Fetch Story Source

on:
  workflow_dispatch:
    inputs:
      surah:
        description: 'رقم السورة (يوسف=12)'
        default: '12'
      slug:
        description: 'الاسم اللاتيني (yusuf)'
        default: 'yusuf'

permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install requests

      - name: Fetch surah
        run: python scripts/fetch_story.py ${{ inputs.surah }} ${{ inputs.slug }}

      - name: Show first 3 ayahs
        run: |
          python -c "
          import json
          data = json.load(open('data/stories/${{ inputs.slug }}/source.json'))
          print(f'السورة: {data[\"name\"]} | {data[\"total_ayahs\"]} آية')
          for a in data['ayahs'][:3]:
              print(f'  [{a[\"number\"]}] {a[\"text\"][:80]}')
              print(f'      📚 {a[\"tafsir\"][:100]}')
          "

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stories/
          if ! git diff --cached --quiet; then
            git commit -m "chore: fetch story source for ${{ inputs.slug }}"
            git push
          fi
