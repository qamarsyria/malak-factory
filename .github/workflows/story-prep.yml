name: 🧪 تجهيز القصة التالية

on:
  schedule:
    - cron: '0 2 */3 * *'   # كل 3 أيام الساعة 2 فجراً UTC
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -q pyarabic beautifulsoup4

      - name: Check if prep needed
        id: check
        run: |
          STORY=$(python scripts/check_prep_needed.py 2>/dev/null || echo "")
          if [ -n "$STORY" ]; then
            echo "story_to_prep=$STORY" >> $GITHUB_OUTPUT
            echo "🔧 سيُجهّز: $STORY"
          else
            echo "story_to_prep=" >> $GITHUB_OUTPUT
            echo "⏭️ لا حاجة"
          fi

      - name: Collect
        if: steps.check.outputs.story_to_prep != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/collect_story.py ${{ steps.check.outputs.story_to_prep }}

      - name: Audit
        if: steps.check.outputs.story_to_prep != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/audit_story.py ${{ steps.check.outputs.story_to_prep }}

      - name: Notify success
        if: steps.check.outputs.story_to_prep != '' && success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ تم تجهيز القصة التالية: ${{ steps.check.outputs.story_to_prep }}"

      - name: Commit
        if: steps.check.outputs.story_to_prep != '' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stories/
          git commit -m "🧪 تجهيز قصة: ${{ steps.check.outputs.story_to_prep }}" || echo "لا تغييرات"
          git push || true
