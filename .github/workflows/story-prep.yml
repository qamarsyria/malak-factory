name: 🧪 تجهيز القصة التالية

on:
  schedule:
    - cron: '0 2 */3 * *'   # كل 3 أيام الساعة 2 فجراً UTC
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install minimal deps
        run: |
          pip install --upgrade pip
          pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Check if prep needed
        id: check
        run: |
          STORY=$(python scripts/check_prep_needed.py 2>/dev/null || echo "")
          if [ -n "$STORY" ]; then
            echo "story_to_prep=$STORY" >> $GITHUB_OUTPUT
            echo "🔧 سيُجهّز: $STORY"
          else
            echo "story_to_prep=" >> $GITHUB_OUTPUT
            echo "⏭️ لا حاجة"
          fi

      - name: Collect
        id: collect
        if: steps.check.outputs.story_to_prep != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/collect_story.py "${{ steps.check.outputs.story_to_prep }}"

      - name: Audit
        id: audit
        if: steps.collect.outcome == 'success'
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/audit_story.py "${{ steps.check.outputs.story_to_prep }}"

      - name: Notify success
        if: success() && steps.check.outputs.story_to_prep != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ تجهيز القصة التالية جاهز: ${{ steps.check.outputs.story_to_prep }}"

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 فشل تجهيز القصة: ${{ steps.check.outputs.story_to_prep || 'unknown' }}"

      - name: Commit prepared data
        if: success() && steps.check.outputs.story_to_prep != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stories/
          git commit -m "🧪 تجهيز قصة: ${{ steps.check.outputs.story_to_prep }}" || echo "لا تغييرات"
          git push || true
