# .github/workflows/test_fetch.yml
name: 🧪 Test Fetch Story

on:
  workflow_dispatch:
    inputs:
      story_id:
        default: 'maryam'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -q requests gunicorn || true
      - name: Run fetch
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python scripts/fetch_story.py --story-id "${{ github.event.inputs.story_id }}"
      - name: Show result
        run: |
          echo "=== First 100 lines ==="
          head -100 data/story-raw/${{ github.event.inputs.story_id }}.json || echo "no file"
