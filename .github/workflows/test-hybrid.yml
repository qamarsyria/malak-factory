name: Test Hybrid Audio

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests edge-tts

      - name: Run Test
        run: python scripts/test_hybrid_audio.py

      - name: Upload Audio
        uses: actions/upload-artifact@v4
        with:
          name: Hybrid-Test-Audio
          path: out/FINAL_HYBRID_TEST.mp3
