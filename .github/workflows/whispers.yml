name: 🌙 همسات ملك

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  whispers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      models: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-hosny-amiri

      - name: Install Project Requirements
        run: |
          python -m pip install --upgrade pip==24.0
          pip install requests edge-tts pillow arabic-reshaper huggingface_hub quranic-phonemizer
          pip install omegaconf==2.0.5
          
      - name: Install RVC Dependencies
        run: |
          pip install torch==2.5.0 torchvision==0.20.0 torchaudio==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 scipy librosa==0.10.2 soundfile ffmpeg-python fairseq==0.12.2 faiss-cpu praat-parselmouth transformers==4.39.3 av onnxruntime pyworld torchcrepe matplotlib

      - name: Download RVC Engine & Prepare Models
        run: |
          wget -q https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI/archive/refs/heads/main.zip
          unzip -q main.zip
          mv Retrieval-based-Voice-Conversion-WebUI-main Retrieval-based-Voice-Conversion-WebUI
          
          cd Retrieval-based-Voice-Conversion-WebUI
          
          mkdir -p infer infer/modules infer/modules/vc
          touch infer/__init__.py infer/modules/__init__.py infer/modules/vc/__init__.py
          
          mkdir -p assets/hubert_base assets/rmvpe
          wget -q -O assets/hubert_base/pytorch_model.bin https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/pytorch_model.bin
          wget -q -O assets/hubert_base/config.json https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/config.json
          wget -q -O assets/rmvpe/rmvpe.pt https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/rmvpe.pt

      - name: Download Malak Models
        run: |
          wget -q -O malak_voice.pth https://github.com/qamarsyria/malak-factory/releases/download/v1.0/malak_voice.pth
          wget -q -O added_malak_voice.index https://github.com/qamarsyria/malak-factory/releases/download/v1.0/added_malak_voice.index

      - name: Generate Whisper
        id: gen
        run: |
          python -u scripts/generate_whispers.py
          if [ -f out/latest_whisper.txt ]; then
            EP_FILE=$(cat out/latest_whisper.txt)
            echo "EP_FILE=$EP_FILE" >> $GITHUB_OUTPUT
            echo "EP_NAME=$(basename "$EP_FILE" .json)" >> $GITHUB_OUTPUT
          else
            echo "❌ فشل التوليد"
            exit 1
          fi

      - name: Build Audio (Edge TTS)
        id: aud
        if: steps.gen.outputs.EP_FILE != ''
        env:
          TTS_ENGINE: "2" # يستخدم Edge TTS
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python scripts/whispers_audio.py \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "out/${{ steps.gen.outputs.EP_NAME }}.mp3"
          
          if [ ! -f "out/${{ steps.gen.outputs.EP_NAME }}.mp3" ]; then
            echo "❌ فشل توليد الصوت."
            exit 1
          fi

      - name: Convert to Malak Voice
        id: convert
        if: steps.aud.outcome == 'success'
        run: |
          python malak_converter.py \
            "out/${{ steps.gen.outputs.EP_NAME }}.mp3" \
            "out/${{ steps.gen.outputs.EP_NAME }}_malak.mp3"

      - name: Build Video
        id: vid
        if: steps.convert.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/whispers_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}_malak.mp3" \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "videos/${{ steps.gen.outputs.EP_NAME }}.mp4"

      - name: Upload to Telegram
        id: tg
        if: steps.vid.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VIDEO="videos/${{ steps.gen.outputs.EP_NAME }}.mp4"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" -F "video=@${VIDEO}" \
            -F "caption=🌙 همسات ملك (بصوت ملك - Edge TTS)" -F "supports_streaming=true"

      - name: Cleanup
        if: steps.tg.outcome == 'success'
        run: |
          rm -rf videos/*.mp4 out/*.mp3
          rm -rf data/whispers/generated/*.json
          rm -f out/latest_whisper.txt
