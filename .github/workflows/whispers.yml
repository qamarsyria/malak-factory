name: 🌙 همسات ملك

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: 'محور الحلقة (اتركه auto للتناوب التلقائي)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - prayer_niqab
          - fantasy_fairies
          - modest_love
          - trinity_names
      speaker:
        description: 'الصوت (auto للتنويع)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - he
          - she
          - duet

jobs:
  whispers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      models: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Fast & Mirror-Safe)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q " ass "; then
            echo "⬇️ تحميل FFmpeg الثابت مع دعم libass مباشرة من GitHub..."
            wget -q --timeout=45 -O /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              || true
            if [ -s /tmp/ffmpeg.tar.xz ]; then
              mkdir -p /tmp/ffmpeg_ext
              tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg_ext --strip-components=1
              sudo install -m 755 /tmp/ffmpeg_ext/bin/ffmpeg /usr/local/bin/ffmpeg
              sudo install -m 755 /tmp/ffmpeg_ext/bin/ffprobe /usr/local/bin/ffprobe
              rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg_ext
            else
              sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15
              sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15 -o Acquire::Retries=3 ffmpeg
            fi
          fi

          echo "⬇️ تثبيت خط الأميري مباشرة من GitHub..."
          sudo mkdir -p /usr/share/fonts/amiri
          wget -q --timeout=30 -O /tmp/Amiri-1.000.zip \
            https://github.com/aliftype/amiri/releases/download/1.000/Amiri-1.000.zip
          python - << 'EOF'
          import zipfile, pathlib, shutil
          tmp = pathlib.Path("/tmp/amiri_ext")
          tmp.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile("/tmp/Amiri-1.000.zip", "r") as zf:
              zf.extractall(tmp)
          for ttf in tmp.rglob("*.ttf"):
              shutil.copy2(ttf, pathlib.Path("/usr/share/fonts/amiri") / ttf.name)
          EOF
          rm -rf /tmp/Amiri-1.000.zip /tmp/amiri_ext
          command -v fc-cache >/dev/null 2>&1 && sudo fc-cache -f /usr/share/fonts/amiri || true
          ffmpeg -version | head -n 2
          ls -la /usr/share/fonts/amiri

      - name: Install Project Requirements
        run: |
          python -m pip install --upgrade pip==24.0
          pip install requests edge-tts pillow
          pip install omegaconf==2.0.5

      - name: Install RVC Dependencies
        run: |
          pip install torch==2.5.0 torchvision==0.20.0 torchaudio==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 scipy librosa==0.10.2 soundfile ffmpeg-python fairseq==0.12.2 faiss-cpu praat-parselmouth "transformers>=4.49,<4.50" av onnxruntime pyworld torchcrepe

      - name: Cache RVC Engine & Base Models
        id: rvc-cache
        uses: actions/cache@v4
        with:
          path: |
            rvc
          key: rvc-engine-v3

      - name: Download RVC Engine & Prepare Models
        if: steps.rvc-cache.outputs.cache-hit != 'true'
        run: |
          wget -q --timeout=60 -O main.zip https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI/archive/refs/heads/main.zip
          python -m zipfile -e main.zip .
          rm -rf rvc
          mv Retrieval-based-Voice-Conversion-WebUI-main rvc
          rm -f main.zip

          cd rvc
          mkdir -p infer infer/modules infer/modules/vc assets/hubert_base assets/rmvpe assets/weights
          touch infer/__init__.py infer/modules/__init__.py infer/modules/vc/__init__.py

          wget -q --timeout=90 -O assets/hubert_base/pytorch_model.bin https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/pytorch_model.bin
          wget -q --timeout=30 -O assets/hubert_base/config.json https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/config.json
          wget -q --timeout=30 -O assets/hubert_base/preprocessor_config.json https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/preprocessor_config.json || true
          wget -q --timeout=90 -O assets/rmvpe/rmvpe.pt https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/rmvpe.pt
          cp assets/rmvpe/rmvpe.pt rmvpe.pt

      - name: Download Voice Models (He + Malak)
        run: |
          mkdir -p rvc/assets/weights

          # صوتها (ملك)
          wget -q --timeout=60 -O rvc/assets/weights/malak_voice.pth \
            https://github.com/qamarsyria/malak-factory/releases/download/v1.0/malak_voice.pth
          wget -q --timeout=60 -O rvc/assets/weights/added_malak_voice.index \
            https://github.com/qamarsyria/malak-factory/releases/download/v1.0/added_malak_voice.index

          # صوتك (clean + rough) — أضف روابط التنزيل هنا إذا كانت في Release آخر:
          # wget -q --timeout=60 -O rvc/assets/weights/clean.pth "YOUR_URL/clean.pth"
          # wget -q --timeout=60 -O rvc/assets/weights/clean.index "YOUR_URL/clean.index"
          # wget -q --timeout=60 -O rvc/assets/weights/rough.pth "YOUR_URL/rough.pth"
          # wget -q --timeout=60 -O rvc/assets/weights/rough.index "YOUR_URL/rough.index"

          # نسخ الأوزان الموجودة مسبقاً داخل المستودع (إن وجدت في assets/weights)
          if [ -d assets/weights ]; then
            cp -n assets/weights/* rvc/assets/weights/ 2>/dev/null || true
          fi
          ls -lh rvc/assets/weights/

      - name: Generate Whisper (Poetry + Grammar & I'rab Gate)
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          MALAK_LAM_MODE: fatha
        run: |
          mkdir -p out videos
          ARGS=""
          if [ "${{ github.event.inputs.theme }}" != "" ] && [ "${{ github.event.inputs.theme }}" != "auto" ]; then
            ARGS="$ARGS --theme ${{ github.event.inputs.theme }}"
          fi
          if [ "${{ github.event.inputs.speaker }}" != "" ] && [ "${{ github.event.inputs.speaker }}" != "auto" ]; then
            ARGS="$ARGS --speaker ${{ github.event.inputs.speaker }}"
          fi
          python -u scripts/generate_whispers.py $ARGS

          if [ -f out/latest_whisper.txt ]; then
            EP_FILE=$(cat out/latest_whisper.txt)
            echo "EP_FILE=$EP_FILE" >> $GITHUB_OUTPUT
            echo "EP_NAME=$(basename "$EP_FILE" .json)" >> $GITHUB_OUTPUT
          else
            echo "❌ فشل التوليد"
            exit 1
          fi

      - name: Build Dry Audio & Music Bed
        id: aud
        if: steps.gen.outputs.EP_FILE != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          python -u scripts/whispers_audio.py \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "out/${{ steps.gen.outputs.EP_NAME }}.mp3"

          if [ ! -f "out/${{ steps.gen.outputs.EP_NAME }}.mp3" ]; then
            echo "❌ فشل توليد الصوت."
            exit 1
          fi

      - name: Convert Dual Voices & Studio Mastering
        id: convert
        if: steps.aud.outcome == 'success'
        env:
          HE_PITCH_CLEAN: '-6'
          HE_PITCH_ROUGH: '-4'
          SHE_PITCH: '0'
        run: |
          python -u malak_converter.py \
            "out/${{ steps.gen.outputs.EP_NAME }}.mp3" \
            "out/${{ steps.gen.outputs.EP_NAME }}_malak.mp3"

      - name: Build Enchanted 9:16 Video
        id: vid
        if: steps.convert.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python -u scripts/whispers_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}_malak.mp3" \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "videos/${{ steps.gen.outputs.EP_NAME }}.mp4"

      - name: Upload to Telegram
        id: tg
        if: steps.vid.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VIDEO="videos/${{ steps.gen.outputs.EP_NAME }}.mp4"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@${VIDEO}" \
            -F "caption=🌙 همسات ملك" \
            -F "supports_streaming=true"

      - name: Cleanup
        if: steps.tg.outcome == 'success'
        run: |
          rm -rf videos/*.mp4 out/*.mp3 out/*_meta.json out/audio_work
          rm -rf data/whispers/generated/*.json
          rm -f out/latest_whisper.txt
