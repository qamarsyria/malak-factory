name: 🌙 همسات ملك

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  whispers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      models: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-hosny-amiri
          pip install --upgrade pip
          pip install requests edge-tts pillow arabic-reshaper huggingface_hub quranic-phonemizer

      - name: Generate Whisper
        id: gen
        run: |
          python -u scripts/generate_whispers.py
          if [ -f out/latest_whisper.txt ]; then
            EP_FILE=$(cat out/latest_whisper.txt)
            echo "EP_FILE=$EP_FILE" >> $GITHUB_OUTPUT
            echo "EP_NAME=$(basename "$EP_FILE" .json)" >> $GITHUB_OUTPUT
          else
            echo "❌ فشل التوليد"
            exit 1
          fi

      - name: Build Audio
        id: aud
        if: steps.gen.outputs.EP_FILE != ''
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python scripts/whispers_audio.py \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "out/${{ steps.gen.outputs.EP_NAME }}.mp3"

      # 🌟 هنا السطر اللي كان ناقص - الفيديو
      - name: Build Video
        id: vid
        if: steps.aud.outcome == 'success'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p videos
          python scripts/whispers_video.py \
            "out/${{ steps.gen.outputs.EP_NAME }}.mp3" \
            "${{ steps.gen.outputs.EP_FILE }}" \
            "videos/${{ steps.gen.outputs.EP_NAME }}.mp4"

      - name: Upload to Telegram
        id: tg
        if: steps.vid.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VIDEO="videos/${{ steps.gen.outputs.EP_NAME }}.mp4"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" -F "video=@${VIDEO}" \
            -F "caption=🌙 همسات ملك" -F "supports_streaming=true"

      - name: Cleanup
        if: steps.tg.outcome == 'success'
        run: |
          rm -rf videos/*.mp4 out/*.mp3
          rm -rf data/whispers/generated/*.json
          rm -f out/latest_whisper.txt
