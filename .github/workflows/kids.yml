name: "🧸 قصص الأطفال 3D (زيد ونور وميار)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kids_story:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "📥 سحب المستودع"
        uses: actions/checkout@v4

      - name: "🐍 إعداد Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📦 تثبيت الحزم والخطوط العربية"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg fonts-hosny-amiri libraqm-dev libfribidi-dev libharfbuzz-dev
          pip install --upgrade -q pip
          pip install -q "numpy<2" pillow requests arabic-reshaper python-bidi \
            edge-tts "gradio_client>=1.10.0,<2.0.0" opencv-python-headless onnxruntime huggingface_hub

      - name: "✍️ تأليف قصة الأطفال وتوليد الأصوات"
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          KIDS_BOY_NAME: "زَيْد"
          KIDS_GIRL_NAME: "نُور"
          KIDS_MAYAR_NAME: "مَيَّار"
        run: |
          python -u scripts/kids_story.py

      - name: "🎬 إخراج الفيديو الكرتوني 3D"
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ENABLE_KIDS_I2V: "1"
          ENABLE_8D_RAYS: "0"
          ENABLE_8D_PARTICLES: "0"
          KIDS_BOY_NAME: "زَيْد"
          KIDS_GIRL_NAME: "نُور"
          KIDS_MAYAR_NAME: "مَيَّار"
        run: |
          EP_JSON=$(cat out/kids/latest_kids_ep.txt)
          python -u scripts/kids_video.py "$EP_JSON" "out/kids/kids_final.mp4"

      - name: "📤 إرسال الفيديو إلى تلجرام"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import json, os, requests
          from pathlib import Path
          ep_path = Path(Path("out/kids/latest_kids_ep.txt").read_text(encoding="utf-8").strip())
          ep = json.loads(ep_path.read_text(encoding="utf-8"))
          vid = Path("out/kids/kids_final.mp4")
          assert vid.exists() and vid.stat().st_size > 10000, "❌ ملف الفيديو غير موجود أو فارغ"
          tok = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          cid = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if tok and cid:
              cap = f"🧸 قصص الأطفال — مَلَاكُ المَعْرِفَةِ\n📖 {ep.get('title','')}\n✨ الحكمة: {ep.get('moral_card','')}"
              with open(vid, "rb") as vf:
                  r = requests.post(
                      f"https://api.telegram.org/bot{tok}/sendVideo",
                      data={"chat_id": cid, "caption": cap, "supports_streaming": "true"},
                      files={"video": vf},
                      timeout=180,
                  )
              print("Telegram:", r.status_code, r.text[:200])
              data = r.json()
              assert r.status_code == 200 and data.get("ok"), f"❌ فشل الرفع إلى تلجرام: {r.text}"
          EOF

      - name: "💾 حفظ حالة القصص"
        run: |
          git config --global http.version HTTP/1.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/kids_state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(kids): update kids_state.json [skip ci]"
            for attempt in 1 2 3; do
              echo "🔄 محاولة حفظ الحالة ($attempt/3)..."
              git pull --rebase --autostash || true
              if git push; then
                echo "✅ تم الحفظ بنجاح"
                exit 0
              fi
              sleep $((attempt * 10))
            done
            echo "⚠️ تعذر git push بعد 3 محاولات"
          fi
