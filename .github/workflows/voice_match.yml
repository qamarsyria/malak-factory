name: 🎯 Prepare Training Data

on:
  workflow_dispatch:
    inputs:
      user_pitch_hz:
        description: 'ترددك (130 = موصى)'
        required: false
        default: '130'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg zip

      - name: ⬇️ تحميل صوتك
        run: |
          wget -q -O 8.m4a "https://github.com/qamarsyria/malak-factory/releases/download/v2.0-myvoice/8.m4a"
          wget -q -O 9.m4a "https://github.com/qamarsyria/malak-factory/releases/download/v2.0-myvoice/9.m4a"
          ffmpeg -y -i 8.m4a -ar 16000 -ac 1 part1.wav 2>/dev/null
          ffmpeg -y -i 9.m4a -ar 16000 -ac 1 part2.wav 2>/dev/null
          printf "file '%s'\n" "$PWD/part1.wav" "$PWD/part2.wav" > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -ar 16000 -ac 1 my_voice.wav 2>/dev/null
          echo "✅ my_voice.wav: $(du -h my_voice.wav | cut -f1)"

      - name: 🎼 تجهيز الحزمة
        env:
          USER_PITCH_HZ: ${{ github.event.inputs.user_pitch_hz || '130' }}
        run: python prepare_training_data.py

      - name: 📤 رفع Artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-data
          path: training_data.zip
          retention-days: 30
