name: 🎙️ Convert Reciter to My Voice (CPU)

on:
  workflow_dispatch:
    inputs:
      surah_num:
        description: 'رقم السورة (مثال: 093)'
        required: true
        default: '093'
      reciter_url:
        description: 'رابط القارئ'
        required: true
        default: 'https://everyayah.com/data/Abdurrahmaan_As-Sudais_192kbps/'
      pitch:
        description: 'درجة الصوت (Pitch)'
        required: true
        default: '-4'

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg git
          pip install -q "pip<24.1" "setuptools<81"
          pip install -q torch==2.5.0 torchvision==0.20.0 torchaudio==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==1.26.4 scipy librosa==0.10.2 soundfile transformers==4.39.3 onnxruntime av praat-parselmouth faiss-cpu==1.7.3 pyworld torchcrepe huggingface_hub requests
          pip install -q fairseq==0.12.2 || echo "⚠️ fairseq فشل"

      - name: 📥 Clone RVC & Fix Torch Bug
        run: |
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git rvc
          cd rvc
          # إصلاح مشكلة torch.load (weights_only)
          find . -name "*.py" -exec sed -i 's/torch\.load(\([^)]*\)map_location="cpu")/torch.load(\1map_location="cpu", weights_only=False)/g' {} \;
          find . -name "*.py" -exec sed -i 's/torch\.load(\([^)]*\)map_location=torch\.device("cpu"))/torch.load(\1map_location=torch.device("cpu"), weights_only=False)/g' {} \;

      - name: 📥 Download Models & Yours
        working-directory: rvc
        run: |
          mkdir -p assets/hubert assets/rmvpe assets/weights assets/pretrained_v2
          
          # تحميل نماذج RVC الأساسية
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/checkpoint_best_legacy_500.pt -O assets/hubert/hubert_base.pt
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/rmvpe.pt -O assets/rmvpe/rmvpe.pt
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2/f0G48k.pth -O assets/pretrained_v2/f0G48k.pth
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2/f0D48k.pth -O assets/pretrained_v2/f0D48k.pth
          
          # تحميل موديلك من جيت هوب
          wget -q https://github.com/qamarsyria/malak-factory/releases/download/v3.0-myvoice/my_voice.pth -O assets/weights/my_voice.pth
          wget -q https://github.com/qamarsyria/malak-factory/releases/download/v3.0-myvoice/added_my_voice.index -O added_my_voice.index
          
          echo "✅ الملفات جاهزة:"
          ls -lh assets/weights/my_voice.pth added_my_voice.index

      - name: 🎵 Download Audio & Convert
        working-directory: rvc
        run: |
          # تحميل الآيات من EveryAyah
          for i in 1 2 3; do
            wget -q "${{ github.event.inputs.reciter_url }}${{ github.event.inputs.surah_num }}00${i}.mp3" -O ../part${i}.mp3
          done
          for i in 1 2 3; do echo "file '../part${i}.mp3'" >> ../list.txt; done
          ffmpeg -y -f concat -safe 0 -i ../list.txt -ar 48000 -ac 1 ../input.wav
          
          # التحويل
          export PYTHONPATH=$PWD
          python tools/infer_cli.py \
            --model assets/weights/my_voice.pth \
            --input ../input.wav \
            --output ../result.wav \
            --index added_my_voice.index \
            --f0-method rmvpe \
            --pitch ${{ github.event.inputs.pitch }} \
            --protect 0.33 \
            --index-rate 0.75 \
            --rms-mix-rate 0.25

      - name: 📤 Send to Telegram
        if: always()
        run: |
          if [ -f result.wav ]; then
            curl -s -F chat_id="-1004433624098" \
                 -F document=@result.wav \
                 -F caption="🎙️ النتيجة (Pitch: ${{ github.event.inputs.pitch }})" \
                 "https://api.telegram.org/bot8959255443:AAE7OLIMa9ZFyFlcNQrJ2UO9nquaCvktvsc/sendDocument"
          else
            curl -s -X POST "https://api.telegram.org/bot8959255443:AAE7OLIMa9ZFyFlcNQrJ2UO9nquaCvktvsc/sendMessage" \
                 -d chat_id="-1004433624098" -d text="⚠️ فشل التحويل، تحقق من GitHub Actions logs"
          fi
