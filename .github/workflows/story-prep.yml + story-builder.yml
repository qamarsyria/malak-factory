story-prep.yml (منفصل، خلفية)
  └─ يشتغل عند اقتراب نهاية القصة الحالية
  └─ يجمع + يدقق القصة التالية
  └─ يخزّن في data/stories/{next}/collected + audited
  └─ يُشعر تلغرام: "القصة التالية جاهزة"

story-builder.yml (يومي)
  └─ يقرأ الحالة (global.json)
  └─ يولّد حلقة من القصة الحالية (إذا الـ collected جاهز)
  └─ يبني الفيديوهين + يرفع تلغرام
  └─ عند انتهاء القصة → تلقائياً يستخدم القصة المجهزة
