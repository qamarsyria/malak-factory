name: Test NeuCodec Only

on:
  workflow_dispatch:

jobs:
  test-neucodec:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchaudio==2.9.1 torchvision==0.24.1 \
            --index-url https://download.pytorch.org/whl/cpu
          pip freeze | grep -E '^(torch|torchaudio|torchvision)==' > /tmp/c.txt
          pip install torchao==0.15.0 torchtune==0.6.1 --constraint /tmp/c.txt
          pip install soundfile numpy --constraint /tmp/c.txt
          pip install neucodec --no-deps --constraint /tmp/c.txt
          pip install local_attention vector-quantize-pytorch transformers --constraint /tmp/c.txt

      - name: Check memory
        run: |
          echo "🔍 الذاكرة المتاحة:"
          free -h
          echo ""
          echo "🔍 مساحة القرص:"
          df -h /home/runner

      - name: Test NeuCodec isolated
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p output
          python -c "
          import torch
          import soundfile as sf
          print('🔧 تحميل NeuCodec ...')
          from neucodec import NeuCodec
          codec = NeuCodec.from_pretrained('neuphonic/neucodec').eval()
          print('✅ NeuCodec محمّل')
          print()
          print('🎵 توليد نغمة اختبار (1 ثانية، 440Hz) ...')
          t = torch.linspace(0, 1, 16000)
          sig = torch.sin(2 * 3.14159 * 440 * t).unsqueeze(0).unsqueeze(0)
          print(f'📊 شكل الإدخال: {sig.shape}')
          print()
          print('🔐 ترميز ...')
          with torch.no_grad():
              codes = codec.encode_code(sig)
          print(f'📊 codes: {codes.shape} = {codes.numel()} توكن')
          print()
          print('🔓 فك الترميز ...')
          with torch.no_grad():
              recon = codec.decode_code(codes).cpu().numpy()[0, 0]
          print(f'📊 طول الصوت: {len(recon)} عينة = {len(recon)/24000:.2f} ثانية')
          sf.write('output/tone_test.wav', recon, 24000, subtype='PCM_16')
          print()
          print('✅ نجح! الملف: output/tone_test.wav')
          "
          echo ""
          echo "🔍 الذاكرة بعد الاختبار:"
          free -h
          ls -lah output/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neucodec-tone-test
          path: output/
          retention-days: 3
