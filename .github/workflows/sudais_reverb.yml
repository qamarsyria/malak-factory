name: 🎙️ Ultimate Studio (5 Reciters + EQ + Reverb + Doubling)

on:
  workflow_dispatch:
    inputs:
      pitch:
        description: 'درجة الصوت (Pitch)'
        required: true
        default: '-6'
      reverb_amount:
        description: 'شدة الصدى (0.0 إلى 1.0) - 0.3 مناسب'
        required: true
        default: '0.3'
      doubling:
        description: 'القراءة الجماعية (true/false)'
        required: true
        default: 'true'

env:
  RELEASE_TAG: 'v4.0-clean' 

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # رفعنا الوقت عشان 5 قراء

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg git wget
          pip install -q "pip<24.1" "setuptools<81"
          pip install -q torch==2.5.0 torchvision==0.20.0 torchaudio==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==1.26.4 scipy librosa==0.10.2 soundfile transformers==4.39.3 onnxruntime av praat-parselmouth faiss-cpu==1.7.3 pyworld torchcrepe huggingface_hub requests matplotlib omegaconf ffmpeg-python
          pip install -q fairseq==0.12.2 || echo "⚠️ fairseq skipped"

      - name: 📥 Clone & Download NEW Models
        run: |
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git rvc
          cd rvc
          grep -rl "torch.load(" --include="*.py" . | xargs -r sed -i 's/torch\.load(\([^)]*\)map_location="cpu")/torch.load(\1map_location="cpu", weights_only=False)/g'
          mkdir -p assets/hubert_base assets/rmvpe assets/weights assets/pretrained_v2
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/config.json -O assets/hubert_base/config.json
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/preprocessor_config.json -O assets/hubert_base/preprocessor_config.json
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/pytorch_model.bin -O assets/hubert_base/pytorch_model.bin
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/rmvpe.pt -O assets/rmvpe/rmvpe.pt
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2/f0G48k.pth -O assets/pretrained_v2/f0G48k.pth
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2/f0D48k.pth -O assets/pretrained_v2/f0D48k.pth
          wget -nv https://github.com/qamarsyria/malak-factory/releases/download/${{ env.RELEASE_TAG }}/my_clean_voice.pth -O assets/weights/my_clean_voice.pth
          wget -nv https://github.com/qamarsyria/malak-factory/releases/download/${{ env.RELEASE_TAG }}/added_my_clean_voice.index -O added_my_clean_voice.index

      - name: 🎵 Convert All 5 Reciters (Maryam 10-15)
        working-directory: rvc
        run: |
          export PYTHONPATH=$PWD
          
          # قائمة القراء الخمسة
          declare -A RECITERS=(
            ["Yasser"]="https://everyayah.com/data/Yasser_Ad-Dussary_128kbps/"
            ["Nasser"]="https://everyayah.com/data/Nasser_Alqatami_128kbps/"
            ["Maher"]="https://everyayah.com/data/MaherAlMuaiqly128kbps/"
            ["Ajmi"]="https://everyayah.com/data/Ahmed_ibn_Ali_al-Ajamy_128kbps/"
            ["Ghamdi"]="https://everyayah.com/data/Ghamadi_192kbps/"
          )

          for RECITER in "${!RECITERS[@]}"; do
            URL="${RECITERS[$RECITER]}"
            echo "====================================="
            echo "🎙️ Processing: $RECITER (Maryam 10-15)"
            echo "====================================="
            
            # 1. تحميل الآيات 10 إلى 15 من سورة مريم
            rm -f list.txt part_*.mp3
            for a in {10..15}; do
              padded_a=$(printf "%03d" $a)
              wget -q "${URL}019${padded_a}.mp3" -O part_${a}.mp3
              echo "file 'part_${a}.mp3'" >> list.txt
            done
            ffmpeg -y -f concat -safe 0 -i list.txt -ar 48000 -ac 1 input_${RECITER}.wav

            # 2. التحويل بالموديل النظيف
            echo "🎙️ Converting..."
            python infer/cli.py \
              --model assets/weights/my_clean_voice.pth \
              --input input_${RECITER}.wav \
              --output raw_${RECITER}.wav \
              --index added_my_clean_voice.index \
              --f0-method rmvpe \
              --pitch ${{ github.event.inputs.pitch }} \
              --protect 0.4 \
              --index-rate 0.4 \
              --rms-mix-rate 0.8
              
            # 3. المعادل الصوتي (EQ) المخصص
            echo "🎛️ Applying EQ..."
            ffmpeg -y -i raw_${RECITER}.wav \
              -af "equalizer=f=200:t=q:w=1.5:g=1,equalizer=f=3000:t=q:w=2:g=1.5,equalizer=f=8000:t=q:w=2:g=-2,equalizer=f=10000:t=q:w=1.5:g=0.5" \
              eq_${RECITER}.wav

            # 4. إضافة الصدى (Reverb)
            echo "🌊 Applying Reverb..."
            REVERB_AMOUNT=${{ github.event.inputs.reverb_amount }}
            ffmpeg -y -i eq_${RECITER}.wav \
              -af "aecho=0.8:${REVERB_AMOUNT}:60:0.5" \
              reverb_${RECITER}.wav

            # 5. القراءة الجماعية (Doubling)
            if [ "${{ github.event.inputs.doubling }}" = "true" ]; then
              echo "👥 Applying Doubling..."
              ffmpeg -y -i reverb_${RECITER}.wav -af "adelay=30|30,volume=0.7" delayed_${RECITER}.wav
              ffmpeg -y -i reverb_${RECITER}.wav -i delayed_${RECITER}.wav -filter_complex "[0:a][1:a]amix=inputs=2:duration=first" doubled_${RECITER}.wav
              FINAL_FILE="doubled_${RECITER}.wav"
            else
              FINAL_FILE="reverb_${RECITER}.wav"
            fi

            # 6. تحويل لـ MP3 وإرسال للتلغرام
            ffmpeg -y -i $FINAL_FILE -b:a 320k final_${RECITER}.mp3
            curl -s -F chat_id="-1004433624098" \
                 -F audio=@final_${RECITER}.mp3 \
                 -F caption="🎙️ مريم (10-15) - $RECITER | EQ + Reverb + Doubling" \
                 "https://api.telegram.org/bot8959255443:AAE7OLIMa9ZFyFlcNQrJ2UO9nquaCvktvsc/sendAudio"
                 
            echo "✅ $RECITER done and sent!"
          done
