name: 🎙️ Triple-Layer Mixer + Echo Studio

on:
  workflow_dispatch:
    inputs:
      pitch_clean:
        description: 'باتش الصافي (Clean)'
        required: true
        default: '-6'
      pitch_rough:
        description: 'باتش المشوش (Rough)'
        required: true
        default: '-4'
      pitch_malak:
        description: 'باتش ملك (Malak)'
        required: true
        default: '0'
      permille_clean:
        description: 'الصافي (من 1000)'
        required: true
        default: '875'
      permille_rough:
        description: 'المشوش (من 1000)'
        required: true
        default: '125'
      permille_malak:
        description: 'ملك (من 1000)'
        required: true
        default: '0'
      echo_delay_ms:
        description: 'زمن تأخير الصدى بالمللي ثانية (1 = واحد بالألف)'
        required: true
        default: '1'
      echo_volume_permille:
        description: 'نسبة صوت الصدى (من 1000) - 100 تعني 10%'
        required: true
        default: '100'
      echo_repeats:
        description: 'عدد تكرارات الصدى (مثلاً 2 أو 3)'
        required: true
        default: '2'

env:
  RELEASE_CLEAN: 'v4.0-clean'
  RELEASE_ROUGH: 'v3.1-myvoice'
  RELEASE_MALAK: 'v1.0'

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg git wget
          pip install -q "pip<24.1" "setuptools<81"
          pip install -q torch==2.5.0 torchvision==0.20.0 torchaudio==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==1.26.4 scipy librosa==0.10.2 soundfile transformers==4.39.3 onnxruntime av praat-parselmouth faiss-cpu==1.7.3 pyworld torchcrepe huggingface_hub requests matplotlib omegaconf ffmpeg-python
          pip install -q fairseq==0.12.2 || echo "⚠️ fairseq skipped"

      - name: 📥 Clone & Download 3 Models
        run: |
          git clone --depth 1 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git rvc
          cd rvc
          grep -rl "torch.load(" --include="*.py" . | xargs -r sed -i 's/torch\.load(\([^)]*\)map_location="cpu")/torch.load(\1map_location="cpu", weights_only=False)/g'
          mkdir -p assets/hubert_base assets/rmvpe assets/weights assets/pretrained_v2
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/config.json -O assets/hubert_base/config.json
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/preprocessor_config.json -O assets/hubert_base/preprocessor_config.json
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/pytorch_model.bin -O assets/hubert_base/pytorch_model.bin
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/rmvpe.pt -O assets/rmvpe/rmvpe.pt
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2/f0G48k.pth -O assets/pretrained_v2/f0G48k.pth
          wget -q https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/pretrained_v2/f0D48k.pth -O assets/pretrained_v2/f0D48k.pth
          
          wget -nv https://github.com/qamarsyria/malak-factory/releases/download/${{ env.RELEASE_CLEAN }}/my_clean_voice.pth -O assets/weights/clean.pth
          wget -nv https://github.com/qamarsyria/malak-factory/releases/download/${{ env.RELEASE_CLEAN }}/added_my_clean_voice.index -O clean.index
          
          wget -nv https://github.com/qamarsyria/malak-factory/releases/download/${{ env.RELEASE_ROUGH }}/my_voice.pth -O assets/weights/rough.pth
          wget -nv https://github.com/qamarsyria/malak-factory/releases/download/${{ env.RELEASE_ROUGH }}/added_my_voice.index -O rough.index
          
          wget -nv https://github.com/qamarsyria/malak-factory/releases/download/${{ env.RELEASE_MALAK }}/malak_voice.pth -O assets/weights/malak.pth
          wget -nv https://github.com/qamarsyria/malak-factory/releases/download/${{ env.RELEASE_MALAK }}/added_malak_voice.index -O malak.index

      - name: 🎵 Convert, Mix & Apply Echo
        working-directory: rvc
        run: |
          export PYTHONPATH=$PWD
          
          URL="https://everyayah.com/data/Yasser_Ad-Dussary_128kbps/"
          rm -f list.txt part_*.mp3
          for a in {17..21}; do
            padded_a=$(printf "%03d" $a)
            wget -q "${URL}050${padded_a}.mp3" -O part_${a}.mp3
            echo "file 'part_${a}.mp3'" >> list.txt
          done
          ffmpeg -y -f concat -safe 0 -i list.txt -ar 48000 -ac 1 input_yasser.wav

          echo "🎙️ Converting 3 Layers..."
          python infer/cli.py --model assets/weights/clean.pth --input input_yasser.wav --output out_clean.wav --index clean.index --f0-method rmvpe --pitch ${{ github.event.inputs.pitch_clean }} --protect 0.4 --index-rate 0.4 --rms-mix-rate 0.8
          python infer/cli.py --model assets/weights/rough.pth --input input_yasser.wav --output out_rough.wav --index rough.index --f0-method rmvpe --pitch ${{ github.event.inputs.pitch_rough }} --protect 0.4 --index-rate 0.4 --rms-mix-rate 0.8
          python infer/cli.py --model assets/weights/malak.pth --input input_yasser.wav --output out_malak.wav --index malak.index --f0-method rmvpe --pitch ${{ github.event.inputs.pitch_malak }} --protect 0.4 --index-rate 0.4 --rms-mix-rate 0.8

          echo "🔬 Mixing..."
          PERM_CLEAN="${{ github.event.inputs.permille_clean }}"; [ -z "$PERM_CLEAN" ] && PERM_CLEAN="875"
          PERM_ROUGH="${{ github.event.inputs.permille_rough }}"; [ -z "$PERM_ROUGH" ] && PERM_ROUGH="125"
          PERM_MALAK="${{ github.event.inputs.permille_malak }}"; [ -z "$PERM_MALAK" ] && PERM_MALAK="0"

          VAL_CLEAN=$(awk "BEGIN {print $PERM_CLEAN / 1000}")
          VAL_ROUGH=$(awk "BEGIN {print $PERM_ROUGH / 1000}")
          VAL_MALAK=$(awk "BEGIN {print $PERM_MALAK / 1000}")

          ffmpeg -y -i out_clean.wav -i out_rough.wav -i out_malak.wav -filter_complex \
            "[0:a]volume=${VAL_CLEAN}[a1]; [1:a]volume=${VAL_ROUGH}[a2]; [2:a]volume=${VAL_MALAK}[a3]; [a1][a2][a3]amix=inputs=3:normalize=0,alimiter" \
             final_custom_mix.wav

          echo "🌊 Applying Custom Echo..."
          DELAY="${{ github.event.inputs.echo_delay_ms }}"; [ -z "$DELAY" ] && DELAY="1"
          VOL="${{ github.event.inputs.echo_volume_permille }}"; [ -z "$VOL" ] && VOL="100"
          REPEATS="${{ github.event.inputs.echo_repeats }}"; [ -z "$REPEATS" ] && REPEATS="2"

          # تحويل الصوت من 1000 إلى نسبة عشرية
          VOL_DEC=$(awk "BEGIN {print $VOL / 1000}")

          # بناء أوامر التأخير والتكرار (ديناميكياً حسب عدد التكرارات)
          DELAYS=""
          DECAYS=""
          CURRENT_DELAY=0
          CURRENT_DECAY=$VOL_DEC

          for (( i=1; i<=REPEATS; i++ )); do
              CURRENT_DELAY=$((CURRENT_DELAY + DELAY))
              if [ $i -eq 1 ]; then
                  DELAYS="$CURRENT_DELAY"
                  DECAYS="$CURRENT_DECAY"
              else
                  DELAYS="$DELAYS|$CURRENT_DELAY"
                  CURRENT_DECAY=$(awk "BEGIN {print $CURRENT_DECAY / 2}") # كل تكرار بيضعف للنص
                  DECAYS="$DECAYS|$CURRENT_DECAY"
              fi
          done

          echo "Echo: Delay=${DELAY}ms | Volume=${VOL_DEC} | Repeats=${REPEATS}"
          echo "Aecho Filter: aecho=0.8:0.9:${DELAYS}:${DECAYS}"

          # تطبيق الصدى
          ffmpeg -y -i final_custom_mix.wav -af "aecho=0.8:0.9:${DELAYS}:${DECAYS}" final_with_echo.wav

          # تحويل لـ MP3 وإرسال
          ffmpeg -y -i final_with_echo.wav -b:a 320k final_output.mp3
          curl -s -F chat_id="-1004433624098" \
               -F audio=@final_output.mp3 \
               -F caption="🎙️ ق (17-21) | Mix: ${PERM_CLEAN}/${PERM_ROUGH}/${PERM_MALAK} | Echo: ${DELAY}ms" \
               "https://api.telegram.org/bot8959255443:AAE7OLIMa9ZFyFlcNQrJ2UO9nquaCvktvsc/sendAudio"
