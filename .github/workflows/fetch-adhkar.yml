name: Fetch Adhkar Library
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python scripts/fetch_adhkar_library.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/libraries/adhkar-library.json.gz
          git commit -m "📚 بناء مكتبة الأذكار الضخمة" || echo "لا تغييرات"
          git push || true
