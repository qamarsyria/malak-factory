name: RVC Voice Conversion

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" scipy librosa soundfile ffmpeg-python transformers faiss-cpu pyworld torchcrepe praat-parselmouth huggingface_hub requests

      - name: Clone RVC Repo
        run: |
          git clone -q https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git
          cd Retrieval-based-Voice-Conversion-WebUI
          git checkout -q 81eed5e8f68b6bed1789f682fe78cdd324495afc

      - name: Run Conversion
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_rvc.py
