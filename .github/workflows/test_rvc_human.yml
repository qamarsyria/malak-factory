# ═══ فحص الملفات قبل الإرسال ═══
- name: Debug - List Files
  run: |
    echo "📂 الملفات الصوتية الموجودة في المجلد الرئيسي:"
    ls -la *.wav || echo "⚠️ ما في ملفات wav في المجلد الرئيسي"
    
    echo ""
    echo "📂 الملفات الصوتية في مجلد RVC:"
    ls -la Retrieval-based-Voice-Conversion-WebUI/*.wav || echo "⚠️ ما في ملفات wav في مجلد RVC"
    
    echo ""
    echo "📂 ملفات الإدخال:"
    ls -la input_*.wav || echo "⚠️ ما في ملفات إدخال"

# ═══ الإرسال للتلغرام ═══
- name: Send to Telegram
  env:
    TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  run: |
    # فحص الملفات قبل الإرسال
    if [ ! -f "out_abdul_maryam.wav" ]; then
      echo "❌ ملف عبد الباسط مش موجود!"
      exit 1
    fi
    if [ ! -f "out_alafasy_maryam.wav" ]; then
      echo "❌ ملف العفاسي مش موجود!"
      exit 1
    fi
    
    curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendAudio" -F "chat_id=${CHAT_ID}" -F "audio=@out_abdul_maryam.wav" -F "caption=🎧 عبد الباسط (مريم 2-6) - حدة +1"
    curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendAudio" -F "chat_id=${CHAT_ID}" -F "audio=@out_alafasy_maryam.wav" -F "caption=🎧 العفاسي (مريم 2-6) - حدة -1"
