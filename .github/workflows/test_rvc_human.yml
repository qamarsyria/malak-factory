name: 🧪 Test 4 Reciters (Pre-Filters)

on:
  workflow_dispatch:

jobs:
  test_4_voices:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip==24.0
          pip install omegaconf==2.0.5
          pip install torch==2.5.0 torchvision==0.20.0 torchaudio==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 scipy librosa==0.10.2 soundfile ffmpeg-python fairseq==0.12.2 faiss-cpu praat-parselmouth transformers==4.39.3 av onnxruntime pyworld torchcrepe matplotlib

      - name: Download RVC Engine & Prepare Models
        run: |
          wget -q https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI/archive/refs/heads/main.zip
          unzip -q main.zip
          mv Retrieval-based-Voice-Conversion-WebUI-main Retrieval-based-Voice-Conversion-WebUI
          
          cd Retrieval-based-Voice-Conversion-WebUI
          mkdir -p infer infer/modules infer/modules/vc assets/hubert_base assets/rmvpe
          touch infer/__init__.py infer/modules/__init__.py infer/modules/vc/__init__.py
          
          wget -q -O assets/hubert_base/pytorch_model.bin https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/pytorch_model.bin
          wget -q -O assets/hubert_base/config.json https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/config.json
          wget -q -O assets/rmvpe/rmvpe.pt https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/rmvpe.pt

      - name: Download Malak Models
        run: |
          wget -q -O malak_voice.pth https://github.com/qamarsyria/malak-factory/releases/download/v1.0/malak_voice.pth
          wget -q -O added_malak_voice.index https://github.com/qamarsyria/malak-factory/releases/download/v1.0/added_malak_voice.index

      # ═══ 1. السديس (نظيف) ═══
      - name: Test Sudais
        run: |
          wget -q -O sudais.mp3 https://everyayah.com/data/Abdurrahmaan_As-Sudais_192kbps/002255.mp3
          python malak_converter.py sudais.mp3 out_sudais.wav

      # ═══ 2. المنشاوي (فيه صدى) ═══
      - name: Test Minshawy
        run: |
          wget -q -O minshawy.mp3 https://everyayah.com/data/Minshawy_Murattal_128kbps/002255.mp3
          python malak_converter.py minshawy.mp3 out_minshawy.wav

      # ═══ 3. عبد الباسط (نظيف) ═══
      - name: Test Abdul Basit
        run: |
          wget -q -O abdulbasit.mp3 https://everyayah.com/data/Abdul_Basit_Murattal_192kbps/002255.mp3
          python malak_converter.py abdulbasit.mp3 out_abdulbasit.wav

      # ═══ 4. العفاسي (حاد) ═══
      - name: Test Alafasy
        run: |
          wget -q -O alafasy.mp3 https://everyayah.com/data/Alafasy_128kbps/002255.mp3
          python malak_converter.py alafasy.mp3 out_alafasy.wav

      # ═══ الإرسال للتلغرام ═══
      - name: Send to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendAudio" -F "chat_id=${CHAT_ID}" -F "audio=@out_sudais.wav" -F "caption=🎧 1. السديس (مع الفلاتر القبلية)"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendAudio" -F "chat_id=${CHAT_ID}" -F "audio=@out_minshawy.wav" -F "caption=🎧 2. المنشاوي (مع الفلاتر القبلية)"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendAudio" -F "chat_id=${CHAT_ID}" -F "audio=@out_abdulbasit.wav" -F "caption=🎧 3. عبد الباسط (مع الفلاتر القبلية)"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendAudio" -F "chat_id=${CHAT_ID}" -F "audio=@out_alafasy.wav" -F "caption=🎧 4. العفاسي (مع الفلاتر القبلية)"
