name: 🧪 Test Maryam (5 min) - Refined

on:
  workflow_dispatch:

jobs:
  test_maryam:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip==24.0
          pip install omegaconf==2.0.5
          pip install torch==2.5.0 torchvision==0.20.0 torchaudio==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 scipy librosa==0.10.2 soundfile ffmpeg-python fairseq==0.12.2 faiss-cpu praat-parselmouth transformers==4.39.3 av onnxruntime pyworld torchcrepe matplotlib

      - name: Download RVC Engine & Prepare Models
        run: |
          wget -q https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI/archive/refs/heads/main.zip
          unzip -q main.zip
          mv Retrieval-based-Voice-Conversion-WebUI-main Retrieval-based-Voice-Conversion-WebUI
          
          cd Retrieval-based-Voice-Conversion-WebUI
          mkdir -p infer infer/modules infer/modules/vc assets/hubert_base assets/rmvpe
          touch infer/__init__.py infer/modules/__init__.py infer/modules/vc/__init__.py
          
          wget -q -O assets/hubert_base/pytorch_model.bin https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/pytorch_model.bin
          wget -q -O assets/hubert_base/config.json https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/hubert_base/config.json
          wget -q -O assets/rmvpe/rmvpe.pt https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main/rmvpe.pt

      - name: Download Malak Models
        run: |
          wget -q -O malak_voice.pth https://github.com/qamarsyria/malak-factory/releases/download/v1.0/malak_voice.pth
          wget -q -O added_malak_voice.index https://github.com/qamarsyria/malak-factory/releases/download/v1.0/added_malak_voice.index

      # ═══ 1. عبد الباسط (مريم 2-11) + PITCH +1 ═══
      - name: Test Abdul Basit (Maryam 2-11, +1 Pitch)
        env:
          PITCH_OFFSET: "1"
        run: |
          python -c "
          import urllib.request, os, subprocess
          os.makedirs('tmp', exist_ok=True)
          files = []
          for i in range(2, 12):
              fn = f'019{i:03d}.mp3'
              url = f'https://everyayah.com/data/Abdul_Basit_Murattal_192kbps/{fn}'
              path = os.path.abspath(f'tmp/{fn}')
              urllib.request.urlretrieve(url, path)
              files.append(path)
          with open('tmp/list.txt', 'w') as f:
              for m in files: f.write(f'file \'{m}\'\n')
          subprocess.run(['ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', 'tmp/list.txt', '-ar', '48000', '-ac', '1', 'input_abdul.wav'], check=True)
          "
          python malak_converter.py input_abdul.wav out_abdul_maryam.wav

      # ═══ 2. العفاسي (مريم 2-11) + PITCH -1 ═══
      - name: Test Alafasy (Maryam 2-11, -1 Pitch)
        env:
          PITCH_OFFSET: "-1"
        run: |
          python -c "
          import urllib.request, os, subprocess
          os.makedirs('tmp', exist_ok=True)
          files = []
          for i in range(2, 12):
              fn = f'019{i:03d}.mp3'
              url = f'https://everyayah.com/data/Alafasy_128kbps/{fn}'
              path = os.path.abspath(f'tmp/{fn}')
              urllib.request.urlretrieve(url, path)
              files.append(path)
          with open('tmp/list.txt', 'w') as f:
              for m in files: f.write(f'file \'{m}\'\n')
          subprocess.run(['ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', 'tmp/list.txt', '-ar', '48000', '-ac', '1', 'input_alafasy.wav'], check=True)
          "
          python malak_converter.py input_alafasy.wav out_alafasy_maryam.wav

      # ═══ الإرسال للتلغرام ═══
      - name: Send to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendAudio" -F "chat_id=${CHAT_ID}" -F "audio=@out_abdul_maryam.wav" -F "caption=🎧 عبد الباسط (مريم 2-11) - حدة +1"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendAudio" -F "chat_id=${CHAT_ID}" -F "audio=@out_alafasy_maryam.wav" -F "caption=🎧 العفاسي (مريم 2-11) - حدة -1"
