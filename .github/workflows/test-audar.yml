name: Test Audar TTS

on:
  workflow_dispatch:
    inputs:
      test_text:
        description: 'نص تجريبي (اتركه فارغاً للاستخدام الافتراضي)'
        required: false
        default: ''
        type: string

jobs:
  test-audar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 curl

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install torchao==0.3.1
          pip install torchtune==0.2.1
          pip install huggingface_hub soundfile numpy scipy librosa neucodec
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download reference audio
        run: |
          mkdir -p assets/audio/reference
          REF="assets/audio/reference/sudais_ref.mp3"
          URLS=(
            "https://everyayah.com/data/Alafasy_128kbps/012004.mp3"
            "https://everyayah.com/data/Abdurrahmaan_As-Sudais_192kbps/012004.mp3"
            "https://everyayah.com/data/Abdurrahmaan_As-Sudais_64kbps/012004.mp3"
            "https://everyayah.com/data/Minshawy_Murattal_128kbps/012004.mp3"
          )
          SUCCESS=0
          for URL in "${URLS[@]}"; do
            echo "⬇️ تجربة: $URL"
            if curl -L -f --max-time 30 -o "$REF" "$URL"; then
              SIZE=$(stat -c%s "$REF")
              echo "📦 الحجم: $SIZE بايت"
              if [ "$SIZE" -gt 20000 ]; then
                echo "✅ نجح: $URL"
                SUCCESS=1
                break
              fi
            fi
          done
          [ "$SUCCESS" -ne 1 ] && { echo "❌ فشلت جميع الروابط"; exit 1; }
          ffmpeg -y -i "$REF" -ar 24000 -ac 1 -c:a pcm_s16le \
            assets/audio/reference/sudais_ref.wav
          ls -lah assets/audio/reference/
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            assets/audio/reference/sudais_ref.wav

      - name: Download model and generate audio
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST_TEXT: ${{ inputs.test_text }}
        run: |
          python scripts/audio_mixer_audar.py

      - name: Check output
        if: always()
        run: |
          ls -lah output/ || echo "⚠️ مجلد output غير موجود"

      - name: Upload audio artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audar-audio-output
          path: output/
          retention-days: 7
          if-no-files-found: warn
