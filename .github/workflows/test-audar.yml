name: Test Audar TTS

on:
  workflow_dispatch:
    inputs:
      test_text:
        description: 'نص تجريبي (اتركه فارغاً للاستخدام الافتراضي)'
        required: false
        default: ''
        type: string

jobs:
  test-audar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # 1. llama-cpp-python من فهرس العجلات الجاهزة (CPU)
          pip install llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          # 2. الحزم المساعدة من PyPI
          pip install \
            huggingface_hub \
            soundfile \
            numpy \
            scipy \
            librosa
          # 3. torch نسخة CPU من فهرسه الخاص
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download model and generate audio
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST_TEXT: ${{ inputs.test_text }}
        run: |
          python scripts/audio_mixer_audar.py

      - name: Check output
        if: always()
        run: |
          echo "📁 محتويات مجلد output:"
          ls -lah output/ || echo "⚠️ مجلد output غير موجود"

      - name: Upload audio artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audar-audio-output
          path: output/
          retention-days: 7
          if-no-files-found: warn
