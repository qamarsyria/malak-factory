name: Test Audar TTS

on:
  workflow_dispatch:
    inputs:
      test_text:
        description: 'نص تجريبي (اتركه فارغاً للافتراضي)'
        required: false
        default: ''
        type: string

jobs:
  test-audar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 curl

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.9.1 torchaudio==2.9.1 torchvision==0.24.1 \
            --index-url https://download.pytorch.org/whl/cpu
          pip freeze | grep -E '^(torch|torchaudio|torchvision)==' > /tmp/c.txt
          pip install torchao==0.15.0 torchtune==0.6.1 --constraint /tmp/c.txt
          pip install llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            --constraint /tmp/c.txt
          pip install huggingface_hub soundfile numpy scipy librosa \
            --constraint /tmp/c.txt
          pip install neucodec --no-deps --constraint /tmp/c.txt
          pip install local_attention vector-quantize-pytorch transformers \
            --constraint /tmp/c.txt

      - name: Download reference audio
        run: |
          mkdir -p assets/audio/reference output
          REF="assets/audio/reference/sudais_ref.mp3"
          URLS=(
            "https://everyayah.com/data/Alafasy_128kbps/012004.mp3"
            "https://everyayah.com/data/Abdurrahmaan_As-Sudais_192kbps/012004.mp3"
          )
          SUCCESS=0
          for URL in "${URLS[@]}"; do
            if curl -L -f --max-time 30 -o "$REF" "$URL"; then
              SIZE=$(stat -c%s "$REF")
              if [ "$SIZE" -gt 20000 ]; then
                SUCCESS=1
                break
              fi
            fi
          done
          [ "$SUCCESS" -ne 1 ] && { echo "❌ فشل التحميل"; exit 1; }
          ffmpeg -y -i "$REF" -ar 16000 -ac 1 -c:a pcm_s16le \
            assets/audio/reference/sudais_ref.wav
          ls -lah assets/audio/reference/

      - name: Step 1 — Encode reference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/step1_encode_ref.py

      - name: Step 2 — Generate codes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TEST_TEXT: ${{ inputs.test_text }}
        run: python scripts/step2_generate_codes.py

      - name: Step 3 — Decode to WAV
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/step3_decode.py

      - name: Check output
        if: always()
        run: ls -lah output/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audar-audio-output
          path: output/
          retention-days: 7
          if-no-files-found: warn
